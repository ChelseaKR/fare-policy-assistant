generic_edit:
  - path: evals/attestation.py
    marker: "fare-assistant.eval-attestation.v1"
    note: >
      Evaluation attestation and content-addressed input identities are generic.
      Choose project-owned schema namespaces, restate the auxiliary evidence
      inputs (including any domain-specific feed files), and update the
      evaluator source-tree roots for the new package before publishing
      attestations.
  - path: src/assistant/promotion_evidence.py
    marker: "fare-assistant.eval-attestation.v1"
    note: >
      Exact promotion-evidence verification is generic. Replace the
      fare-assistant evaluation schema namespaces with the new project's
      namespaces before accepting or publishing evidence.
  - path: src/assistant/release_attestation.py
    marker: "fare-assistant.promotion-attestation.v1"
    note: >
      The immutable runtime-to-evaluation attestation contract is generic.
      Choose a stable, project-owned promotion-attestation schema namespace
      before publishing release evidence.
  - path: src/assistant/release_identity.py
    marker: "fare-assistant.release.v1"
    note: >
      The release-identity mechanism is generic. Choose stable,
      project-specific namespaces for configuration, release, descriptor,
      domain-profile, and history-key schemas before publishing identities in
      a new domain.
  - path: src/assistant/identity.py
    marker: "fare-assistant.content.v1"
    note: >
      The layered identity mechanism is generic. Choose stable, project-specific
      schema namespaces for CONTENT_SCHEMA and SNAPSHOT_SCHEMA before publishing
      identities in a new domain.
  - path: src/assistant/snapshots.py
    marker: "fare-assistant.source-evidence.v1"
    note: >
      Source-complete, atomic archives are generic. Replace EVIDENCE_SCHEMA with
      a stable namespace owned by the new project before creating archives.
  - path: evals/coverage.py
    marker: "youth/student"
    note: >
      The coverage-matrix mechanism is generic; the PROGRAMS keyword map (senior,
      disabled, medicare, veteran, youth/student, child free, regular) names this
      domain's reduced-fare programs and must be re-stated as the new domain's
      benefit categories.
  - path: evals/spanish_quality.py
    marker: "mst-fares-es.md"
    note: >
      The census/rubric/blank-sheet mechanism is generic: it measures the answer
      quality of a second language that pass/fail parity cannot see. Two things
      are this domain's. The target language is Spanish because this corpus has
      one agency-authored Spanish document; a new domain names its own. And the
      terminology dimension points at corpus/processed/mst-fares-es.md as the
      reference for published vocabulary, which must be re-stated as the new
      domain's own source-language document.
  - path: evals/selftest.py
    marker: "DD Form 214"
    note: >
      The defect-injection mechanism is generic: it plants a wrong answer and
      asserts the deterministic gate catches it. The planted scenarios quote
      this domain's example values (a real fare doc_id, "DD Form 214", "valid
      for return trips"), which must be re-stated as the new domain's required
      facts, forbidden phrases, and a priced doc for the self-test to stay
      meaningful.
  - path: evals/govchat_export.py
    marker: "Suite mapping (fare-policy-assistant"
    note: >
      The recording plumbing is generic; the suite-name mapping in the module
      docstring and the forbidden-term extraction are written against this
      domain's suite names and must be re-stated for the new ones.
  - path: evals/plumbline_export.py
    marker: "Suite mapping (fare-policy-assistant"
    note: >
      The Plumbline adapter is generic apart from two things a new domain must
      re-decide: the source-id scheme (here `doc:<doc_id>`, because this
      assistant cites documents and Plumbline resolves citations by source id)
      and which suites the evidence can honestly support. Read the "one shape
      difference" section before changing either.
  - path: plumbline.pin
    marker: "config = evals/plumbline/target.toml"
    note: >
      Point `config`, `out` and `baseline` at the new repository's paths. Keep
      `ref` an exact commit and re-read the KNOWN DEFECT note before bumping it.
  - path: Makefile
    marker: 'PACKAGE ?= assistant'
    note: >
      Targets are generic. Update PACKAGE to the new import package name. The
      audit target needs no path variable: it resolves its harness from
      plumbline.pin at run time.
  - path: pyproject.toml
    marker: 'name = "fare-policy-assistant"'
    note: "Project name, description, and package discovery paths."
  - path: web/index.html
    marker: "fare"
    note: "Branding, copy, and example questions are transit-specific."

domain_specific:
  - src/assistant/domain.py          # the DomainProfile instance itself
  - src/assistant/facts.py           # typed fare/age facts
  - src/assistant/gtfs.py            # transit feed cross-checking
  - src/assistant/fare_table.py      # GTFS-Fares structured fare table (ADR 0017)
  - src/assistant/scaffold_agency.py # transit-agency contribution kit
  - evals/decline_calibration.py     # calibrated against this corpus/questions
  - web/console.py                   # transit-agency operator surface
  - web/guide.py                     # transit-specific guided fare finder
  - corpus/                          # manifest.yaml + raw/ snapshots
  - evals/suites/                    # case content written from this corpus
  - evals/govchat/                   # exported golden.jsonl + baseline (the recording)
  - evals/plumbline/                 # evidence bundle, target config, baseline, acknowledged findings.
                                     # Deliberately NOT extracted: every floor in target.toml is a
                                     # measurement of this system, and copying those numbers would set
                                     # a new domain a bar describing a different assistant. Author it
                                     # from a first run, the way this one was.
  - evals/spanish/                   # rating census over this corpus's answers
  - docs/audits/                     # second-harness run artifacts
  - prompts/                         # system/answer prompts naming transit
  - tests/test_domain.py
  - tests/test_corpus.py
  - tests/test_ingest.py
  - tests/test_ingest_pipeline.py
  - tests/test_pdf_ingest.py
