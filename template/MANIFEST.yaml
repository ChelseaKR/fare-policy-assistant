# Template manifest: the domain/generic boundary, made machine-checkable.
#
# docs/adapting.md has said in prose, since early in the project, which parts
# of this repo carry over unchanged to a new domain and which parts a new
# domain rewrites. That prose drifted out of sync with the code more than
# once (a file would move or a new domain-specific module would land without
# anyone updating the doc). This manifest is the same claim, but as data:
# `scripts/extract_template.py` reads it to actually build a starter skeleton,
# and `tests/test_extract_template.py` fails CI if a path here goes missing or
# a new top-level module is added without being classified. See P3-5 in
# docs/ROADMAP.md ("Generalize the harness").
#
# Categories:
#   generic          - copied byte-for-byte; no fare-transit content.
#   generic_edit     - copied, but has a marked spot the new domain must edit
#                       (a package name, a path, a docstring example). Each
#                       entry names the marker to search for after copying.
#   domain_specific  - NOT copied. Listed so the manifest is a complete map of
#                       the repo, and so the completeness test can confirm
#                       every tracked top-level module is accounted for one
#                       way or the other.

generic:
  - evals/__init__.py
  - evals/runner.py
  - evals/checks.py
  - evals/judges.py
  - evals/report.py
  - evals/check_report_regression.py
  - evals/calibration.py
  - evals/provenance.py
  - evals/retrieval_ablation.py
  - evals/backend_comparison.py
  - evals/cache.py
  - evals/compare.py
  - evals/history.py
  - evals/reranker_bottleneck_check.py
  - evals/stats.py
  - evals/robustness.py
  - src/assistant/__init__.py
  - src/assistant/guards.py
  - src/assistant/config.py
  - src/assistant/retrieve.py
  - src/assistant/answer.py
  - src/assistant/models.py
  - src/assistant/i18n.py
  - src/assistant/corpus.py
  - src/assistant/ingest.py
  - src/assistant/cli.py
  - src/assistant/contract.py
  - src/assistant/langid.py
  - web/a11y.py
  - web/handler.py
  - web/embed.py
  - web/offline.py
  - web/csp.py
  - web/__init__.py
  - .github/workflows/ci.yml
  - .github/workflows/security.yml
  - .github/workflows/mutation.yml
  - .github/workflows/corpus-freshness.yml
  - docs/adapting.md

generic_edit:
  - path: evals/coverage.py
    marker: "youth/student"
    note: >
      The coverage-matrix mechanism is generic; the PROGRAMS keyword map (senior,
      disabled, medicare, veteran, youth/student, child free, regular) names this
      domain's reduced-fare programs and must be re-stated as the new domain's
      benefit categories.
  - path: evals/selftest.py
    marker: "DD Form 214"
    note: >
      The defect-injection mechanism is generic: it plants a wrong answer and
      asserts the deterministic gate catches it. The planted scenarios quote
      this domain's example values (a real fare doc_id, "DD Form 214", "valid
      for return trips"), which must be re-stated as the new domain's required
      facts, forbidden phrases, and a priced doc for the self-test to stay
      meaningful.
  - path: evals/govchat_export.py
    marker: "Suite mapping (fare-policy-assistant"
    note: >
      GovChat-Eval export plumbing is generic; the suite-name mapping in the
      module docstring and the forbidden-term extraction are written against
      this domain's suite names and must be re-stated for the new ones.
  - path: Makefile
    marker: 'PACKAGE ?= assistant'
    note: >
      Targets are generic. Update PACKAGE to the new import package name and
      EVAL_HARNESS if the govchat-eval clone lives elsewhere.
  - path: pyproject.toml
    marker: 'name = "fare-policy-assistant"'
    note: "Project name, description, and package discovery paths."
  - path: web/index.html
    marker: "fare"
    note: "Branding, copy, and example questions are transit-specific."

domain_specific:
  - src/assistant/domain.py          # the DomainProfile instance itself
  - src/assistant/facts.py           # typed fare/age facts
  - src/assistant/gtfs.py            # transit feed cross-checking
  - src/assistant/scaffold_agency.py # transit-agency contribution kit
  - evals/decline_calibration.py     # calibrated against this corpus/questions
  - web/console.py                   # transit-agency operator surface
  - web/guide.py                     # transit-specific guided fare finder
  - corpus/                          # manifest.yaml + raw/ snapshots
  - evals/suites/                    # case content written from this corpus
  - evals/govchat/                   # exported golden.jsonl + baseline
  - docs/audits/                     # GovChat-Eval run artifacts
  - prompts/                         # system/answer prompts naming transit
  - tests/test_domain.py
  - tests/test_corpus.py
  - tests/test_ingest.py
  - tests/test_ingest_pipeline.py
  - tests/test_pdf_ingest.py
