# GovChat-Eval run configuration for the independent audit of this repo's
# deployed assistant. `make audit` records evals/govchat/golden.jsonl from the
# pipeline, then runs this. CLI flags override these values.
#
# The dataset replays recorded answers (target = "scripted"), so the audit is
# byte-reproducible and runs offline. The default judge is GovChat-Eval's
# deterministic lexical baseline — useful as a reproducible floor, not a real
# benchmark. For real groundedness/multilingual signal, run with `--judge llm`
# (Anthropic; a different model family than this repo's Bedrock answer model,
# so the judge stays independent of the system under test). See
# docs/audits/methodology.md.
[run]
dataset = "evals/govchat/golden.jsonl"
target = "scripted"
# Suites this dataset exercises. Each item now carries an accessible HTML
# transcript, so the a11y suite runs too. bias (declared segments) stays
# omitted — this domain dataset declares no segments, and GovChat-Eval fails a
# selected-but-inapplicable suite closed. See docs/audits/methodology.md.
suite = "groundedness,accuracy,refusal,multilingual,adversarial,representational,a11y"
judge = "deterministic"
seed = 1729
out = "docs/audits"
format = "json,md,html"
# Baseline is passed as an absolute path by `make audit` (a path in this file
# would only resolve from one working directory). Create it after the first
# run: `govchat-eval baseline --from docs/audits/eval-report.json`.
