    agency_scope: E-tran
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?0\\.50|50 cents", "120"]
    rationale: "etran-fares 'Transfers': Elk Grove transfers are issued only when boarding, cost $0.50, and are valid for 120 minutes and one use."

