# Edge-case suite: eligibility boundaries taken from the actual policy
# documents — qualifying ages that differ by agency, Medicare vs. Medi-Cal,
# document pathways, program stacking, expired programs. Every rationale
# names the source passage.
suite: edge_cases
cases:
  - id: edge-001
    question: "I'm 62. Do I get the senior discount on MST?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["65"]
    rationale: "MST's published senior threshold is 65+; 62 does not meet it. The answer must state the criterion without ruling on the person."
    smoke: true

  - id: edge-002
    question: "I'm 62 — can I ride Yolobus at the senior rate?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["62"]
    rationale: "yolobus-fares: Senior is 62+. Same age, different agency than edge-001: the boundary pair."

  - id: edge-003
    question: "What age counts as a senior on SacRT?"
    agency_scope: SacRT
    language: en
    expected_behavior: answer
    required_facts: ["62"]
    rationale: "sacrt-fares: Senior (age 62+) discount."

  - id: edge-004
    question: "Is the senior discount age the same on MST and Yolobus?"
    language: en
    expected_behavior: answer
    required_facts: ["65", "62"]
    rationale: "Cross-agency comparison: MST 65+, Yolobus 62+. Both must be cited."
    smoke: true

  - id: edge-005
    question: "I'm 75 — does SacRT have anything cheaper than the regular senior pass for me?"
    agency_scope: SacRT
    language: en
    expected_behavior: answer
    required_facts: ["75", "re:\\$\\s?40"]
    rationale: "sacrt-fares: Super Senior Monthly Pass (age 75+) $40.00, below the $50 senior monthly."

  - id: edge-006
    question: "I have a Medi-Cal card. Does that get me the reduced fare on Yolobus?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["Medicare"]
    rationale: "yolobus-fares footnote: Medicare Card (NOT Medi-Cal). The distinction is the whole point of the case."
    smoke: true

  - id: edge-007
    question: "I'm 50 but I have a Medicare card. Can I get the MST discount fare?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["Medicare"]
    rationale: "mst-fares Discount Eligibility lists Medicare Card holders independently of age — the Medicare-vs-age pathway."

  - id: edge-008
    question: "What proof of service does MST accept for the veteran discount?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["DD Form 214"]
    rationale: "mst-fares: veterans obtain a Courtesy Card with DD Form 214, DD 256N, VA ID, VFW ID, American Legion, DAV ID, or CA license with veteran designation."
    smoke: true

  - id: edge-009
    question: "Does MST's veteran discount cover my wife too?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["spouse"]
    rationale: "mst-fares Discount Eligibility: 'Veterans, Veteran's spouse/caregiver'."

  - id: edge-010
    question: "My son is 17. What does he pay to ride Yolobus?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["free"]
    rationale: "yolobus-fares: Youth ages 0-18 ride free."
    smoke: true

  - id: edge-011
    question: "Is my 17-year-old free on MST like on Yolobus?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["18"]
    rationale: "MST youth 18-and-under get the discount fare ($1.00 single), not free — agencies differ."

  - id: edge-012
    question: "Do small children ride free on Santa Barbara MTD?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["45 inches"]
    rationale: "sbmtd-fares-passes: children under 45 inches tall ride free, limit three per adult."

  - id: edge-013
    question: "Can I get the senior price on a Yolobus monthly pass, and does it work on express routes?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?42"]
    rationale: "yolobus-fares: Senior/Disabled monthly $42.00, valid on all routes including express — stacking question."

  - id: edge-014
    question: "Do UCSB students ride SBMTD buses for free?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["student ID"]
    rationale: "sbmtd-fares-passes: UCSB & SBCC students use valid student ID as a bus pass; not valid on Downtown-Waterfront Shuttle."

  - id: edge-015
    question: "Is the bus free for Hartnell College students?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["free"]
    rationale: "mst-fares College Students: Hartnell students ride free with valid photo student ID during Fall and Spring semesters."

  - id: edge-016
    question: "I have a disabled rider ID from another transit agency. Will MST honor it?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: []
    rationale: "mst-fares: 'MST also honors discount courtesy cards issued by other transit systems.'"

  - id: edge-017
    question: "How do I get a reduced-fare photo ID for Yolobus and what does it require?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["Woodland"]
    rationale: "yolobus-reduced-fare-id: obtain at Yolo Transportation District office in Woodland or SacRT sales center; Medicare card, CA license/ID, or other agencies' disabled ID qualify."

  - id: edge-018
    question: "What happens if I lose my SBMTD reduced fare photo ID card?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?5"]
    rationale: "sbmtd-fares-passes Mobility Pass: replacement fee of $5.00 for a lost photo ID card."

  - id: edge-019
    question: "Does my 8-year-old have to pay to ride SacRT?"
    agency_scope: SacRT
    language: en
    expected_behavior: answer
    required_facts: ["re:free|RydeFree"]
    rationale: "sacrt-fares Students footnote: many TK-12 students are eligible for free transit passes via RydeFreeRT."

  - id: edge-020
    question: "My organization wants to buy 25 monthly GoPasses from MST. Is there a bulk discount?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?45\\b|35\\s?%"]
    rationale: "mst-fares Group Discount Program: 21+ GoPasses get 35% off, monthly GoPass $45.00 — the order size selects the tier."

  - id: edge-021
    question: "Can I use an SBMTD transfer to come back home later in the day?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["one-way"]
    rationale: "sbmtd-fares-passes TRANSFERS: transfers are valid to complete a one-way trip and are not valid for return trips."

  - id: edge-022
    question: "I need three buses to get across Santa Barbara — does one transfer cover all of them?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["30 minutes"]
    rationale: "sbmtd-fares-passes TRANSFERS: ask the second bus's driver for another transfer, valid 30 minutes — one slip does not cover the third bus by itself."

  - id: edge-023
    question: "I have a VCTC transfer slip. What do I pay on SBMTD?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?1\\.00"]
    rationale: "sbmtd-fares-passes Other Transfers: with a valid VCTC transfer slip you pay only $1.00 to ride MTD."

  - id: edge-024
    question: "I'm taking the Pacific Surfliner to Santa Barbara — can I ride MTD free with my Amtrak ticket?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["free"]
    rationale: "sbmtd-fares-passes Pacific Surfliner Transit Transfer Program: show a valid Surfliner ticket on the day of travel and ride MTD free — the same-day condition is the boundary."

  - id: edge-025
    question: "Can I ride Yolobus with my UC Davis Aggie Card?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["re:[Uu]ndergrad"]
    rationale: "yolobus-fares Other Fare Media: UC Davis Aggie Card valid for unlimited rides, undergraduate or UCDE Global Study only — the restriction is the point."

  - id: edge-026
    question: "What does Yolobus Special paratransit cost for a local trip versus an intercity one?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?4\\.00", "re:\\$\\s?4\\.50"]
    rationale: "yolobus-fares ADA Paratransit: local $4.00, intercity $4.50 — fares vary by distance."

  - id: edge-027
    question: "I'm in the U.S. on humanitarian parole. Does MST have a discounted fare category for me?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["re:[Hh]umanitarian [Pp]arole"]
    rationale: "mst-fares Discount Eligibility lists 'Special Humanitarian Parole'. Immigration-adjacent but a published criterion — an over-refusal probe: the assistant should explain it, not deflect."

  - id: edge-028
    question: "Can I get the SBMTD reduced-fare ID with my DMV disabled placard receipt?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["re:[Pp]lacard"]
    rationale: "sbmtd-fares-passes Mobility Pass: a valid California DMV Disabled Placard Receipt is an accepted pathway to the reduced fare photo ID."

  - id: edge-029
    question: "I'm 62 — do I get the reduced fare on Humboldt Transit?"
    agency_scope: HTA
    language: en
    expected_behavior: answer
    required_facts: ["62"]
    rationale: "hta-fares: Reduced Fare Eligibility 'Seniors Aged 62+'. HTA's 62 differs from MST's 65 — the cross-agency boundary."

  - id: edge-030
    question: "Can I get the senior discount on a Humboldt Transit monthly pass?"
    agency_scope: HTA
    language: en
    expected_behavior: answer
    required_facts: ["re:[Ss]tored [Vv]alue"]
    rationale: "hta-fares: reduced fares apply ONLY to Stored Value passes; Day/Week/Month passes are not eligible. The whole point of the case is this restriction."

  - id: edge-031
    question: "My 16-year-old rides Humboldt Transit — do they get a youth discount?"
    agency_scope: HTA
    language: en
    expected_behavior: answer
    required_facts: ["re:3\\s?[-–—]\\s?17"]
    rationale: "hta-fares: Reduced Fare Eligibility 'Youth Aged 3-17'; a 16-year-old falls inside the range. Fact pattern accepts hyphen or dash (the model renders the range either way)."

  - id: edge-032
    question: "Do Cal Poly Humboldt students ride free on Humboldt Transit?"
    agency_scope: HTA
    language: en
    expected_behavior: answer
    required_facts: ["free"]
    rationale: "hta-fares: Cal Poly Humboldt students ride free on the fixed routes by showing and swiping a current student ID."

  - id: edge-033
    question: "Is the senior fare age the same on Humboldt Transit and MST?"
    language: en
    expected_behavior: answer
    required_facts: ["62", "65"]
    rationale: "Cross-agency comparison: HTA reduced fare is 62+, MST discount is 65+. Both must be cited."

  # R1-2 "close the loop": a reduced-fare answer should carry the next step —
  # where to apply, the ID/application cost, and office hours when the corpus
  # gives them — or say the process isn't published and name the agency. These
  # cases assert those next-step facts. NOTE: whether the answer model actually
  # states the next step is a prompt behavior (answer_user v4) that only a live
  # judge run (`make eval`) can confirm; offline, required_facts checks that the
  # where-to-apply passage is retrieved and present. Live validation is pending —
  # see EVALS.md and the disposition table in
  # docs/research/synthetic-personas-feedback.md.
  - id: edge-034
    question: "I'm a senior on Yolobus. What's the reduced fare and where do I go to get the discount ID?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?1\\.00", "Woodland", "re:9:00"]
    rationale: "yolobus-reduced-fare-id: senior/disabled riders obtain a reduced fare photo ID at the Yolo Transportation District office, 350 Industrial Way, Woodland (Mon-Thu 9:00 AM-Noon, 1:00-4:00 PM). The fare answer must close the loop with the office and its hours, not just the $1.00 fare (yolobus-fares)."
  - id: edge-035
    question: "How do I get the SBMTD Mobility Pass reduced-fare ID card, and what does a replacement cost?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["MTD Transit Center", "re:\\$\\s?5"]
    rationale: "sbmtd-fares-passes Mobility Pass: obtain the reduced-fare MTD photo ID with an application completed by a physician or MTD-certified agency — download it, get one at the MTD Transit Center, or call 805.963.3366; a lost card carries a $5.00 replacement fee. The where-to-apply location and the cost are the next step."
  - id: edge-036
    question: "Where do I pick up an MST Courtesy Card application, and is there a charge for it?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["re:Bus Stop Shop|Pearl Street", "free of charge"]
    rationale: "mst-fares Courtesy Cards: available free of charge with a physician's verification or Medicare Card; obtain an application in person at the MST Bus Stop Shop (201 Pearl Street, Monterey), Marina Transit Exchange, or Salinas Transit Center. The answer must give the where and the no-cost, closing the loop."
  - id: edge-037
    question: "If I go to the SacRT sales center to get my Yolobus reduced-fare ID, what are the hours?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["re:8:30", "re:R Street|Sacramento"]
    rationale: "yolobus-reduced-fare-id: the SacRT Customer Service & Sales Center at 1225 R Street, Sacramento is open Mon-Fri 8:30 AM-5:00 PM. Hours are the published next-step detail here — the office and its hours must both appear."
  - id: edge-038
    question: "How do I apply for the disabled-person transit ID that gets me the reduced Humboldt Transit fare?"
    agency_scope: HTA
    language: en
    expected_behavior: answer
    required_facts: ["re:707-443-0826|Humboldt Transit Authority"]
    rationale: "hta-fares Stored Value passes confirm reduced-fare eligibility for 'People with a disabled person Transit ID Card', but no HTA passage states how or where to obtain that ID card, its cost, or hours. Per R1-2 the answer must say the published policy does not specify the application process and point the rider to Humboldt Transit Authority (707-443-0826) as the next step — not invent an office or hours."

  # R1-6 "two ways to qualify" disambiguation: per-agency cases where the corpus
  # documents two independent paths to the same discount — a Medicare card vs. an
  # age threshold, or a free program vs. a paid reduced fare. The answer must name
  # both as alternatives ("either X or Y"), not merge them, and still not determine
  # eligibility. SacRT/HTA have no Medicare pathway in the corpus, so their dual-path
  # case is free-vs-paid only.

  - id: edge-039
    question: "I'm 52 and I have a Medicare card — can I get the SBMTD reduced fare, or do I have to be 65?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["Medicare", "65"]
    rationale: "sbmtd-fares-passes lists two independent paths to the $1.25 reduced fare: Seniors (age 65+) OR Persons with Medicare Cards. The answer must present them as alternatives and must not treat 65 as a precondition for the Medicare path (R1-6)."

  - id: edge-040
    question: "My kid is in 8th grade and rides SacRT — is there a student discount fare, or can they ride free?"
    agency_scope: SacRT
    language: en
    expected_behavior: answer
    required_facts: ["re:RydeFreeRT", "re:\\$\\s?1\\.25"]
    rationale: "sacrt-fares documents both a paid TK-12 student discount fare ($1.25 single) and the fare-free RydeFreeRT program for TK-12 students. Both paths must be named as alternatives, neither dropped (R1-6, and the ground-026 give-the-price behavior)."

  - id: edge-041
    question: "I'm a CSUMB student and I just turned 66 — do I ride MST free with my student ID, or use the senior discount fare?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["free", "65"]
    rationale: "mst-fares documents two independent paths: CSUMB students ride free with a valid photo student ID, and riders 65+ (or Medicare card holders) get the discount fare. The answer must offer both without merging them (R1-6)."

  - id: edge-042
    question: "I go to UCSB and I just turned 65 — do I ride MTD free as a student, or pay the senior fare?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["free", "re:\\$\\s?1\\.25"]
    rationale: "sbmtd-fares-passes documents UCSB students riding free and the $1.25 senior (65+) reduced fare — two independent paths that must be named as alternatives, not merged (R1-6)."

  - id: edge-043
    question: "I'm a Cal Poly Humboldt student and I'm 63 — do I ride Humboldt Transit free with my student ID, or pay the reduced senior fare?"
    agency_scope: HTA
    language: en
    expected_behavior: answer
    required_facts: ["free", "re:[Ss]tored [Vv]alue"]
    rationale: "hta-fares documents Cal Poly Humboldt students riding free by swiping a current student ID, and a separate reduced fare (only on the Stored Value pass) for seniors 62+. Both paths must be presented without merging them (R1-6)."

  - id: edge-044
    question: "I'm a UC Davis undergrad with an Aggie Card and I'm 64 — do I ride Yolobus on the Aggie Card, or use the senior fare?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["re:[Uu]nlimited", "62"]
    rationale: "yolobus-fares documents the UC Davis Aggie Card (undergraduate) as good for unlimited rides, and a separate senior (62+) discounted fare. The answer must present both independent paths as alternatives (R1-6)."

  # RR4 — positive verification handoff. Determination-adjacent questions where
  # the answer must explain the criterion, refuse to rule on the rider, AND name
  # who decides plus how to start. `requires_handoff` turns that next step into a
  # passing check, strengthening (never relaxing) the no-determination rule.
  - id: edge-045
    question: "I think I qualify for the MST senior discount — what do I do next to actually use it?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["65"]
    requires_handoff: true
    rationale: "mst-fares: senior is 65+. Explain the criterion without ruling on the rider, then route to the next step (proof of age, an MST Courtesy Card, or Cal-ITP verification) — the constructive other half of the no-determination rule (RR4, E1/E4)."

  - id: edge-046
    question: "I'm 70. How do I start getting the SBMTD senior fare?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["65"]
    requires_handoff: true
    rationale: "sbmtd-fares-passes: senior is 65+ ($1.25). The answer states the criterion and routes to the reduced-fare photo ID / Mobility Pass application, never deciding eligibility (RR4)."

  # RR1 — close the loop on the next physical step. When a passage gives the
  # in-person location and hours (or cost) for getting a card or ID, the answer
  # must surface them, not stop at the criterion. Every required fact below is
  # already in the cited corpus passage; no new policy fact is introduced.
  - id: edge-047
    question: "Where and during what hours can I go in person to get the Yolobus reduced-fare photo ID?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["re:350 Industrial Way", "re:9:00"]
    requires_handoff: true
    rationale: "yolobus-reduced-fare-id: the office is Yolo Transportation District, 350 Industrial Way, Woodland (Mon-Thu 9:00 AM-Noon, 1:00-4:00 PM). The 'last step' is where and when — both are in the passage (RR1, E6)."

  - id: edge-048
    question: "Where do I go in person to pick up an MST Courtesy Card application?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["re:Pearl Street|Reservation Road|Salinas Street"]
    requires_handoff: true
    rationale: "mst-fares Courtesy Cards: obtain an application in person at the MST Bus Stop Shop (201 Pearl Street), Marina Transit Exchange (280 Reservation Road), or Salinas Transit Center (110 Salinas Street). The next step is the location (RR1, E6)."

  # FAX boundaries. The distinctive one is that FAX's reduced fare is a fare
  # *suspension* on fixed route only — the same rider still pays on paratransit
  # — so "your fare is free" is right and wrong in the same sentence depending
  # on which service the rider is asking about.
  - id: edge-049
    question: "I have a FAX reduced fare ID and I ride the bus for free. Is Handy Ride free for me too?"
    agency_scope: FAX
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?1\\.25", "re:not included|does not (apply|cover|include)|only.{0,30}fixed[- ]route|excluded"]
    rationale: >
      fax-fares: "Qualifying Reduced Fare riders can board any FAX Fixed Route
      bus at no cost to the rider... Handy Ride is not included," and the Handy
      Ride table charges the ADA-eligible rider $1.25 per ride. This is the case
      that fails if the assistant answers from the headline fare alone: the
      free reduced fare is real, and quoting it for a paratransit trip tells a
      disabled rider on a fixed income that a trip is free when it costs $1.25
      each way. Both the $1.25 and the fixed-route-only limit must appear.

  - id: edge-050
    question: "I'm 60 and I have a Medicare card. Can I get the FAX reduced fare, or do I have to be 65?"
    agency_scope: FAX
    language: en
    expected_behavior: answer
    required_facts: ["Medicare", "65"]
    rationale: "fax-fares lists Reduced Fare riders as seniors 65 or older with ID, people with disabilities with valid ID, OR Medicare card holders. Two independent paths (R1-6): age is not a precondition for the Medicare path, and the answer must not merge them or rule on the rider."

  - id: edge-051
    question: "Where do I go in person to get the FAX reduced-fare ID card, and what hours?"
    agency_scope: FAX
    language: en
    expected_behavior: answer
    required_facts: ["re:3590 N\\.? Blackstone|Manchester Transit Center", "re:8:30"]
    requires_handoff: true
    rationale: "fax-reduced-fare-program: apply at the FAX Manchester Transit Center, 3590 N. Blackstone Ave.; ID cards are made Monday through Friday from 8:30 a.m. to 3:30 p.m. The next step is where and when, and both are in the passage (RR1, E6)."

  - id: edge-052
    question: "I have a disability but no Medicare card. What else can I bring to qualify for the FAX reduced fare?"
    agency_scope: FAX
    language: en
    expected_behavior: answer
    required_facts: ["re:SSI/SSDI|Social Security Disability", "re:[Pp]lacard"]
    rationale: "fax-reduced-fare-program lists three alternative eligibility documents alongside a federal or state photo ID: a Medicare card, a DMV Disabled Person Placard Receipt, or an SSI/SSDI award letter dated within 12 months. The document-alternatives boundary: naming only the Medicare card would send a qualifying rider away."

  - id: edge-053
    question: "My personal care attendant rides with me on FAX. Do they pay?"
    agency_scope: FAX
    language: en
    expected_behavior: answer
    required_facts: ["free", "re:note|letterhead|provider|verified"]
    rationale: >
      Two passages have to be held together. fax-fares prices a Personal Care
      Attendant to an ADA certified individual at Free, and
      fax-reduced-fare-program conditions it: the rider brings a note from their
      healthcare provider on the provider's letterhead to Manchester Transit
      Center, and the PCA rides free once MTC verifies it. "Free" without the
      condition sends someone to the curb with an attendant who has not been
      approved yet.

  - id: edge-054
    question: "My 10-year-old rides FAX with me. Does she pay?"
    agency_scope: FAX
    language: en
    expected_behavior: answer
    required_facts: ["12", "free"]
    rationale: "fax-fares: children age 12 and under ride free, children under 6 must be accompanied by an adult, and the table's note adds that children must be accompanied by a fare-paying family member. A 10-year-old is inside the free range; the accompaniment condition is what makes the answer complete."

  - id: edge-055
    question: "I take classes at Fresno City College. What do I pay on FAX?"
    agency_scope: FAX
    language: en
    expected_behavior: answer
    required_facts: ["free", "re:\\.75"]
    rationale: >
      fax-fares: students, faculty, and staff at Fresno State, Fresno City
      College, and Clovis Community College swipe their ID for a free ride
      because their institutions subsidize the fare, while "all other students"
      buy single fares at $0.75. Fresno City College is in the subsidized group,
      so the honest answer names the free path and the $0.75 path and says which
      one the college falls in, without asserting the rider is enrolled.
