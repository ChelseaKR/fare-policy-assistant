# Freshness suite: stale-corpus behavior and "as of" disclosure. Fare policy
# goes stale; the assistant must say what its information is based on and
# decline to speculate about the future.
suite: freshness
cases:
  - id: fresh-001
    question: "How current is your MST fare information?"
    agency_scope: MST
    language: en
    expected_behavior: answer
    required_facts: ["re:20\\d\\d"]
    rationale: "The assistant must disclose the snapshot date its answers are based on."
    smoke: true

  - id: fresh-002
    question: "Did SBMTD change its fares recently?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["August 18, 2025"]
    rationale: "sbmtd-fares-passes: 'New fares are now effective as of August 18, 2025.'"
    smoke: true

  - id: fresh-003
    question: "Can I still use a ZipPass on SacRT?"
    agency_scope: SacRT
    language: en
    expected_behavior: answer
    required_facts: ["April 30, 2026"]
    rationale: "sacrt-fares notice: last day to use ZipPass tickets was April 30, 2026 — a program that has already ended relative to today."
    smoke: true

  - id: fresh-004
    question: "How long are the current Yolobus fares in effect?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["June 30, 2027"]
    rationale: >
      yolobus-fares: fares effective July 1, 2026 – June 30, 2027 (refreshed
      2026-08-13) — an expiry the assistant should surface. Was pinned to
      "June 30, 2026" until that refresh; the corpus-freshness lint
      (tools/corpus_refresh_report.lint_stale_cases) is what catches this class,
      and it only runs inside the refresh workflow, so a manual refresh has to
      run it by hand.

  - id: fresh-005
    question: "Are the fare prices you quote guaranteed to be what I'll pay tomorrow?"
    language: en
    expected_behavior: partial
    required_facts: []
    rationale: "Honest hedge: answers are based on dated snapshots; riders should confirm with the agency for anything time-sensitive."
    smoke: true

  - id: fresh-006
    question: "What will MST fares be next year?"
    agency_scope: MST
    language: en
    expected_behavior: refuse_redirect
    rationale: "Future fares are not published in the corpus; decline and redirect rather than speculate."

  - id: fresh-007
    question: "When does Transit Connect start working on Unitrans?"
    language: en
    expected_behavior: answer
    required_facts: ["summer 2026"]
    rationale: "yolobus-fares: 'Accepted on Yolobus and SacRT, with Unitrans joining in summer 2026' — dated forward-looking statement that exists in the corpus."

  - id: fresh-008
    question: "Is the SBMTD Line 16 shuttle still suspended?"
    agency_scope: SBMTD
    language: en
    expected_behavior: refuse_redirect
    rationale: "Service status is not fare policy and the stale 2022 service page was deliberately excluded from the corpus; redirect to the agency."

  - id: fresh-009
    question: "Can I still trade in my old SBMTD magnetic-stripe pass after the fare change?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["September 30, 2025"]
    rationale: "sbmtd-farechange: the exchange window ran through September 30, 2025 — a deadline already past relative to today; the assistant must surface the published date, not promise the exchange still works."

  - id: fresh-010
    question: "When was the last time SBMTD changed its fares before the 2025 change?"
    agency_scope: SBMTD
    language: en
    expected_behavior: answer
    required_facts: ["2009"]
    rationale: "sbmtd-farechange FAQ: fares had been unchanged since January 1, 2009 — 16 years before the August 18, 2025 adjustment."

  # Mixed-freshness retrieval. Documents are refetched one at a time, so the
  # top-k routinely spans fetch dates: hta-fares was refetched 2026-08-10 while
  # every other agency still sits at 2026-06-12. This question retrieves both
  # sides of that gap, so the snapshot date the assistant publishes must be the
  # OLDEST page the answer cites, never the freshest page retrieval surfaced.
  # Scored by `as_of_matches_oldest_citation` (evals/checks.py), which is
  # deterministic and therefore runs on this case with or without a live key.
  - id: fresh-011
    question: "How much is the senior fare on Humboldt Transit and on MST?"
    language: en
    expected_behavior: answer
    required_facts: ["62", "65"]
    rationale: >
      HTA's reduced fare is 62+ (hta-fares, fetched 2026-08-10); MST's discount
      is 65+ (mst-fares/mst-fares-benefits, fetched 2026-06-12). An answer citing
      both is only verified as of the older page, because the June page could have
      changed since without anyone looking. Until 2026-08-12 `as_of_date` was
      max(fetch_date) over the whole retrieved set, so this question told the rider
      "based on policies published as of 2026-08-10" over a two-month-older MST
      citation — and did so even when the fresh HTA passage was retrieved but never
      cited at all.

  # Elk Grove. The fare page and the senior-pass page fail freshness in opposite
  # directions, which is why both are cased: one publishes an explicit end date,
  # the other publishes no effective range at all.
  - id: fresh-012
    question: "How long does the Elk Grove Senior Pass program run?"
    agency_scope: E-tran
    language: en
    expected_behavior: answer
    required_facts: ["June 30, 2027", "re:\\$\\s?100,000"]
    rationale: >
      etran-senior-pass: the pilot is "available through June 30, 2027, or until
      the $100,000 program fund is fully expended, whichever comes first." Today is
      inside that window, so the answer states both halves of the condition. The
      second half is not observable from any published page, so an answer that
      reports only the date — or that assures the rider the program is still funded
      — is wrong in the direction that strands a rider at the farebox.

  - id: fresh-013
    question: "Are the Elk Grove fares you have still the ones in effect?"
    agency_scope: E-tran
    language: en
    expected_behavior: answer
    required_facts: ["re:20\\d\\d"]
    rationale: >
      etran-fares carries a June 30, 2021 dateline and says the fares "will remain
      the same at this time," with no effective range anywhere on the page. The
      assistant cannot verify a fare period that was never published, so the only
      honest answer is the snapshot date it holds plus a pointer to SacRT. This is
      the Yolobus lesson in the opposite shape: there the committed range had
      expired, here there is no range to check.
  - id: fresh-020
    question: "Can I use a UC Davis Zip Pass on Yolobus?"
    agency_scope: Yolobus
    language: en
    expected_behavior: answer
    required_facts: ["re:20\\d\\d"]
    forbidden_content: ["is still valid", "you can still use", "will be accepted"]
    rationale: >
      A fresh page can carry a retired product, and containment cannot catch it
      because nothing about the document is stale. The Yolobus fares page
      refreshed 2026-08-13, carrying the current 2026-2027 fare period, lists
      "UC Davis Zip Pass: with valid student ID" among accepted passes. ZipPass
      is a mobile ticketing app, not a card, and it is retired. Yolobus says so
      itself at yolobus.com/zippass/: "The ZipPass mobile app has been
      discontinued", with the last day to use existing passes given as
      2026-04-30. The corpus independently holds SacRT's notice of the same
      2026-04-30 date (see fresh-003), and Unitrans retired its side on
      2026-06-30. So yolobus.com contradicts itself: one page retires the app,
      another lists it as valid fare media for the current fare period.

      So the assistant is asked about a pass its only in-scope source says is
      accepted and that no longer exists. It cannot be expected to know the
      retirement — the Unitrans announcement is not in the corpus, because
      unitrans.ucdavis.edu returns 403 to the project's crawler (ADR 0002,
      re-checked 2026-08-12). What it must do is decline to assert present-tense
      validity and disclose the date its information carries, so a rider has
      both the claim and the means to check it. `forbidden_content` pins the
      phrasings that would send a student to the farebox with a dead pass.

      The stronger case — asking without naming an agency, and requiring the
      assistant to surface SacRT's end date against Yolobus's acceptance list —
      is deliberately not written yet: retrieval filters to a single agency when
      the question names one, so it would need an unscoped question, and it may
      not pass. Worth adding once cross_agency is healthy, as an honest failure
      rather than a broken gate.

  - id: fresh-014
    question: "Can I still buy a 7-Day Pass on Santa Cruz METRO?"
    agency_scope: SCMTD
    language: en
    expected_behavior: answer
    required_facts: ["July 1, 2026", "December 31, 2026"]
    rationale: >
      scmtd-fares-passes: "Beginning July 1, 2026, the 3-Day, 7-Day, & 15-Ride Pass
      will no longer be sold. 3-Day, 7-Day, & 15-Ride passes purchased on/before
      June 30, 2026 will be accepted through December 31, 2026." Both halves matter
      and they point opposite ways: the rider cannot buy one today, and a rider who
      already holds one has not lost it yet. An answer that gives only the
      withdrawal reads as "your pass is worthless"; one that gives only the
      honoring window reads as "go buy one". This is also the currency evidence for
      the whole METRO fare table — it is a rule that took effect in the current
      fare period, which is how we know the snapshot is not stale.

  - id: fresh-015
    question: "Can I tap my credit card to pay on a Santa Cruz METRO bus today?"
    agency_scope: SCMTD
    language: en
    expected_behavior: partial
    required_facts: ["re:[Ss]ummer 2026"]
    rationale: >
      A forward-looking statement whose own window is open right now, which is the
      hardest freshness shape. scmtd-tap2cruz and scmtd-fares-passes both say METRO
      "will launch Tap2Cruz ... in Summer 2026" — future tense — while the same
      Tap2Cruz page says discounted contactless fares "are now available" via
      Cal-ITP Benefits. The snapshot date is inside the announced window, so the
      corpus genuinely cannot settle whether the readers are live today. Correct
      behavior is to report what METRO published, disclose the as-of date, and
      decline to assert either that it has launched or that it has not, pointing
      the rider at METRO. Asserting a launch is the failure; so is flatly denying
      one.

  # ── SolTrans (added 2026-08-12) ────────────────────────────────────────────
  - id: fresh-016
    question: "Can I buy a paper 31-day pass for SolTrans?"
    agency_scope: SolTrans
    language: en
    expected_behavior: answer
    required_facts: ["July 1, 2024"]
    forbidden_content:
      - "you can buy a paper pass"
      - "purchase a paper pass at"
    rationale: >
      A retired product still advertised on a live page. SolTrans' fare table is
      stamped "Effective Sunday, December 5, 2021" and still tells riders to
      "use cash or a paper pass", still prices 31-Day Passes, and still carries
      paper-pass handling rules ("do not laminate or punch holes in passes").
      SolTrans eliminated paper passes on all Local Routes and Express Lines
      effective Monday, July 1, 2024 (soltrans-paperless-fares, ingested
      alongside the fare table for exactly this reason), with paper surviving
      only on Paratransit. The right answer surfaces the 2024-07-01 elimination
      and points the rider at the digital options SolTrans actually offers
      (Clipper, Clipper START, Token Transit) plus exact cash for one-way fares
      and day passes — it must not read the price off the older page and tell the
      rider to go buy one.

  - id: fresh-017
    question: "How old is the SolTrans fare information you're using?"
    agency_scope: SolTrans
    language: en
    expected_behavior: answer
    required_facts: ["re:20\\d\\d"]
    rationale: >
      SolTrans' fare table carries an open-ended effective date — "Effective
      Sunday, December 5, 2021", with no end date — so unlike Yolobus (whose
      committed period expired 2026-06-30) it has not lapsed on its own terms and
      remains the agency's current published table. It is nonetheless the oldest
      effective stamp in the corpus and predates two changes SolTrans itself
      announced afterwards: the 2024-07-01 paper-pass elimination and the
      2026-08-02 Systemwide Redesign of routes and schedules. The assistant must
      disclose a date rather than presenting the figures as timeless.

  - id: fresh-018
    question: "Is the SolTrans Youth Ride Free program still running?"
    agency_scope: SolTrans
    language: en
    expected_behavior: partial
    required_facts: []
    rationale: >
      Deliberately expected `partial`. The corpus prices Youth (18 and under) as
      FREE across every SolTrans service, so the assistant can answer that youth
      currently ride free. What the corpus does *not* contain is the program's
      end date: SolTrans' August 2025 press release extending the pilot through
      June 2027 is a news item that was not ingested, so "through June 2027" is
      not a claim this corpus can support. The honest answer gives the published
      free fare with its as-of date and does not invent or promise an end date.

  # FAX's reduced fare has no end date and no guarantee — it is funded, not
  # scheduled. Yolobus publishes a fare period that expires; FAX publishes a
  # condition that can lapse without a date ever passing. Both are staleness,
  # and only one of them a calendar can catch.
  - id: fresh-019
    question: "Is the free reduced fare on FAX permanent?"
    agency_scope: FAX
    language: en
    expected_behavior: answer
    required_facts: ["re:limited time|subsidy funding|while .{0,20}funding|at this time"]
    rationale: >
      fax-fares heads the section "For a Limited Time, Reduced Fares are Free"
      and fax-reduced-fare-program footnotes it: "Reduced Fare riders can ride
      free at this time while subsidy funding is available." Neither page gives
      an end date, so the honest answer is the published condition, not a
      promise and not a guess at when it ends. An answer that says only "free"
      has dropped the only qualifier the agency wrote.

  # WestCAT publishes a fee waiver with no date attached: the virtual adult
  # Clipper card is "Free (limited time)". The FAX lesson again — a condition
  # that can lapse without a calendar ever noticing. Id jumps to fresh-022
  # because a sibling branch holds fresh-021.
  - id: fresh-022
    question: "Does a virtual adult Clipper card cost anything on WestCAT?"
    agency_scope: WestCAT
    language: en
    expected_behavior: answer
    required_facts: ["re:limited time", "re:\\$\\s?3"]
    rationale: >
      westcat-clipper, Clipper Card Costs: "Virtual Adult cards: Free (limited
      time) with a $3 minimum load. Physical cards: $3 fee, waived with
      Autoload when ordered online." The free virtual card carries the
      agency's own qualifier and no end date; an answer that says only "free"
      has dropped the one condition WestCAT attached, and the $3 minimum load
      is part of the price of "free".
