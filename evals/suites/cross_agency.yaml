# Cross-agency suite: questions that name two corpus agencies and expect an
# answer addressing each, with a citation to each. Retrieval already surfaces
# both agencies' passages (tested in tests/test_retrieve.py); these cases test
# whether the *answer* keeps them separate and cited rather than blurring them.
#
# Status: live-validated targets. The deterministic checks (citation present,
# as-of, language, no determination) run offline, but whether each answer cites
# both agencies and states each fare correctly is an LLM-judge call that needs a
# live `make eval`. No prompt change ships with these: the existing system prompt
# may already handle multi-agency questions, and a live run decides whether a
# rule is needed. These cases are not in the CI smoke subset (no `smoke: true`),
# and the regression baseline must be refreshed (`--update-baseline`) on the
# first live run that includes this suite.
suite: cross_agency
cases:
  - id: xagency-001
    question: "Do youth ride free on both Yolobus and SacRT?"
    language: en
    expected_behavior: answer
    rationale: >
      Yolobus youth 0-18 ride free (yolobus-fares); SacRT offers fare-free transit
      for TK-12 students through RydeFreeRT (sacrt-fares). A good answer states
      both, cites both, and does not conflate the two programs.

  - id: xagency-002
    question: "Is the senior discount age the same on MST and Yolobus?"
    language: en
    expected_behavior: answer
    rationale: >
      MST's discount is 65 and older (mst-fares); Yolobus's senior fare is 62 and
      older (yolobus-fares). The answer must give each age with its agency and
      cite each, not assume one age covers both.

  - id: xagency-003
    question: "What single-ride fares do Yolobus and SacRT charge?"
    language: en
    expected_behavior: answer
    rationale: >
      Yolobus and SacRT publish their own single-ride fares (yolobus-fares,
      sacrt-fares). A correct answer attributes each fare to its agency with a
      citation, rather than reporting one figure for both.

  # ── The Clipper scope case (added 2026-08-12 with SolTrans) ────────────────
  # This is the case SolTrans was added for. Clipper is a *regional* fare card,
  # so a rider naturally reads any Clipper answer as generalizing across the Bay
  # Area — and the assistant has exactly one agency's Clipper documentation and
  # zero evidence about anyone else's. Correct behavior is to answer the SolTrans
  # half and visibly stop.
  - id: xagency-004
    question: "I use a Clipper card on SolTrans. Will it work on SacRT too?"
    language: en
    expected_behavior: partial
    required_facts: ["re:(?i)soltrans"]
    forbidden_content:
      - "SacRT accepts Clipper"
      - "Clipper works on SacRT"
      - "yes, you can use it on SacRT"
      - "SacRT also accepts Clipper"
      - "your Clipper card will work on SacRT"
    rationale: >
      Both agencies are in the corpus, but only one side of this question is.
      soltrans-clipper-card and soltrans-ways-to-pay document Clipper acceptance
      on SolTrans in detail; sacrt-fares says nothing about Clipper at all, and
      neither does any other document in the corpus. SacRT is a Sacramento-region
      agency outside the Clipper service area, so the regional-card intuition is
      not merely unsupported here, it is probably wrong.

      The correct answer states SolTrans' Clipper acceptance with a citation,
      says plainly that the published SolTrans material does not establish
      anything about SacRT's fare media, and sends the rider to SacRT. It must
      not reason "Clipper is a regional Bay Area card, therefore it works on
      SacRT" — that inference has no passage behind it. Expected `partial`
      rather than `answer` because half the question is genuinely unanswerable
      from this corpus, and rather than `refuse_redirect` because the SolTrans
      half is fully answerable and withholding it would be unhelpful.

  - id: xagency-005
    question: "Which agencies in your corpus take Clipper?"
    language: en
    expected_behavior: partial
    required_facts: ["re:(?i)soltrans"]
    forbidden_content:
      - "MST accepts Clipper"
      - "Yolobus accepts Clipper"
      - "Humboldt Transit accepts Clipper"
      - "all of them accept Clipper"
    rationale: >
      The direct form of xagency-004. SolTrans is the only Clipper participant
      documented in this corpus; MST, SBMTD, Yolobus, SacRT, and HTA each publish
      their own agency-local fare media (Courtesy Cards, Tap-to-Pay, stored-value
      passes) and no corpus passage says any of them takes Clipper. The honest
      answer names SolTrans, says the corpus does not establish Clipper status
      for the others, and does not silently convert "not documented" into "does
      not accept" for them either.
