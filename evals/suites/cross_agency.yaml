# Cross-agency suite: questions that name two corpus agencies and expect an
# answer addressing each, with a citation to each. Retrieval already surfaces
# both agencies' passages (tested in tests/test_retrieve.py); these cases test
# whether the *answer* keeps them separate and cited rather than blurring them.
#
# Status: live-validated targets. The deterministic checks (citation present,
# as-of, language, no determination) run offline, but whether each answer cites
# both agencies and states each fare correctly is an LLM-judge call that needs a
# live `make eval`. No prompt change ships with these: the existing system prompt
# may already handle multi-agency questions, and a live run decides whether a
# rule is needed. These cases are not in the CI smoke subset (no `smoke: true`),
# and the regression baseline must be refreshed (`--update-baseline`) on the
# first live run that includes this suite.
suite: cross_agency
cases:
  - id: xagency-001
    question: "Do youth ride free on both Yolobus and SacRT?"
    language: en
    expected_behavior: answer
    rationale: >
      Yolobus youth 0-18 ride free (yolobus-fares); SacRT offers fare-free transit
      for TK-12 students through RydeFreeRT (sacrt-fares). A good answer states
      both, cites both, and does not conflate the two programs.

  - id: xagency-002
    question: "Is the senior discount age the same on MST and Yolobus?"
    language: en
    expected_behavior: answer
    rationale: >
      MST's discount is 65 and older (mst-fares); Yolobus's senior fare is 62 and
      older (yolobus-fares). The answer must give each age with its agency and
      cite each, not assume one age covers both.

  - id: xagency-003
    question: "What single-ride fares do Yolobus and SacRT charge?"
    language: en
    expected_behavior: answer
    rationale: >
      Yolobus and SacRT publish their own single-ride fares (yolobus-fares,
      sacrt-fares). A correct answer attributes each fare to its agency with a
      citation, rather than reporting one figure for both.

  # Elk Grove (E-tran) x SacRT. The single most likely boundary crossing in the
  # corpus: e-tran annexed into SacRT in 2021, the E-prefix routes kept their own
  # fare table, and a rider going from Elk Grove into Sacramento meets both. Every
  # fact each case needs is in a retrieved passage from one of the two agencies.
  - id: xagency-004
    question: "I am 62 and ride the Elk Grove buses. Is the senior fare the same when I ride SacRT?"
    language: en
    expected_behavior: answer
    rationale: >
      Both systems set the senior threshold at 62, and the two prices differ:
      etran-fares puts the Military/Senior/Medicare/Disabled single fare at $1.10,
      while sacrt-fares puts the senior single at $1.25. The trap is the shared age
      cutoff, which invites an answer that treats "same age" as "same fare." A
      correct answer gives each price with its own agency and citation.

  - id: xagency-005
    question: "Can I use my Elk Grove daily pass on SacRT light rail?"
    language: en
    expected_behavior: answer
    rationale: >
      etran-fares "Elk Grove Passes": the Elk Grove daily pass is valid for
      unlimited rides on routes with an "E" prefix and the rider should "obtain a
      transfer, if transferring to other SacRT services"; the same passage notes
      that E routes accept SacRT tickets and passes, with a transfer fee on a light
      rail single ride ticket. sacrt-fares gives the SacRT side: a $0.25 transfer
      ticket. The acceptance runs one way, and an answer that reports it as
      reciprocal sends the rider onto light rail holding a pass that does not cover
      it.

  - id: xagency-006
    question: "Does the Elk Grove Senior Pass cover SacRT light rail too?"
    language: en
    expected_behavior: answer
    rationale: >
      etran-senior-pass defines the program's scope as "SacRT fixed-route bus
      routes that begin or end within the City of Elk Grove," and lists exactly
      which ones: E10-E19 and E110-E116. Light rail is not among them. The answer
      must hold to the published scope and point the rider at SacRT's own light
      rail fares (sacrt-fares) rather than extending a city-funded bus program to a
      mode the page never mentions.

  - id: xagency-007
    question: "Is the fare cap the same on MST and Santa Cruz METRO?"
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?6", "re:31[ -]day"]
    rationale: >
      The sharpest conflation risk in the corpus, because the two agencies are
      neighbors, both run contactless fare payment, and both are Cal-ITP Benefits
      agencies — so the surface story is identical and the rules are not. MST
      publishes three concrete caps: $6 per day, $20 per week, $70 per month
      (mst-fares). Santa Cruz METRO publishes a daily cap and a rolling 31-day cap
      that starts at the first tap, and publishes NO weekly cap at all
      (scmtd-tap2cruz); its cap amounts live in a fare-table image that is not in
      the corpus. A correct answer keeps the two apart, cites each, and says
      METRO's amounts are not in the published text it has. The failure this case
      exists to catch is quoting MST's $6/$20/$70 — or, worse, MST's weekly cap —
      as if it were METRO's, which would send a Santa Cruz rider looking for a
      weekly cap that does not exist.

  - id: xagency-008
    question: "Do 17-year-olds get the discount fare on MST and on Santa Cruz METRO?"
    language: en
    expected_behavior: answer
    required_facts: ["re:18 years and under|18 and under", "re:free"]
    rationale: >
      Same discount word, two different structures. MST lists "18 years and under"
      as a discount-fare category outright (mst-fares). Santa Cruz METRO does not:
      its Discount Fare is "adults age 65 and over, people with disabilities", and
      a 17-year-old is served instead by the Youth Cruz Free Program, which is free
      rather than discounted and covers local Santa Cruz County routes only
      (scmtd-fares-passes). The answer must give each agency its own rule with its
      own citation. Carrying MST's youth discount across the county line is the
      error; so is reporting METRO's youth program as a "discount fare", which
      would understate it.

  # ── The Clipper scope cases (added 2026-08-12 with SolTrans) ───────────────
  # These are the cases SolTrans was added for. Clipper is a *regional* fare
  # card, so a rider naturally reads any Clipper answer as generalizing across
  # the Bay Area, and the corpus's coverage of it is uneven in exactly the way
  # that invites the generalization: seven agencies document acceptance, one
  # (Santa Cruz METRO) documents refusal, and nine say nothing at all. Correct
  # behavior is to answer from the passages and visibly stop.
  #
  # This comment used to say the assistant had "exactly one agency's Clipper
  # documentation and zero evidence about anyone else's", which was true of the
  # six-agency corpus and became wrong without anything noticing. The per-agency
  # split is asserted against the corpus in tests/test_clipper_ground_truth.py
  # so it cannot drift silently again — see issue #162.
  - id: xagency-009
    question: "I use a Clipper card on SolTrans. Will it work on SacRT too?"
    language: en
    expected_behavior: partial
    required_facts: ["re:(?i)soltrans"]
    forbidden_content:
      - "SacRT accepts Clipper"
      - "Clipper works on SacRT"
      - "yes, you can use it on SacRT"
      - "SacRT also accepts Clipper"
      - "your Clipper card will work on SacRT"
    rationale: >
      Both agencies are in the corpus, but only one side of this question is.
      soltrans-clipper-card and soltrans-ways-to-pay document Clipper acceptance
      on SolTrans in detail; SacRT's documents say nothing about Clipper, and no
      document in the corpus — SacRT's or any other agency's — mentions SacRT and
      Clipper together. (Seven other agencies do document Clipper acceptance for
      themselves; see xagency-010. None of that reaches SacRT.) SacRT is a
      Sacramento-region agency outside the Clipper service area, so the
      regional-card intuition is not merely unsupported here, it is probably
      wrong.

      The correct answer states SolTrans' Clipper acceptance with a citation,
      says plainly that the published SolTrans material does not establish
      anything about SacRT's fare media, and sends the rider to SacRT. It must
      not reason "Clipper is a regional Bay Area card, therefore it works on
      SacRT" — that inference has no passage behind it. Expected `partial`
      rather than `answer` because half the question is genuinely unanswerable
      from this corpus, and rather than `refuse_redirect` because the SolTrans
      half is fully answerable and withholding it would be unhelpful.

  - id: xagency-010
    question: "Which agencies in your corpus take Clipper?"
    language: en
    expected_behavior: partial
    required_facts:
      - "SolTrans"
      - "AC Transit"
      - "re:County Connection|CCCTA"
      - "Marin Transit"
      - "SamTrans"
      - "re:\\bVTA\\b|Santa Clara Valley"
      - "WestCAT"
      - "re:Santa Cruz|SCMTD"
    forbidden_content:
      - "MST accepts Clipper"
      - "Yolobus accepts Clipper"
      - "Humboldt Transit accepts Clipper"
      - "all of them accept Clipper"
      - "re:\\b(SacRT|SBMTD|FAX|SLO ?RTA|SJRTD|San Joaquin RTD|e-?tran)\\b[^.]{0,30}\\b(accepts|takes|honors)\\b[^.]{0,25}Clipper"
      - "re:\\bSanta Cruz(?: METRO)?\\b[^.]{0,30}\\b(accepts|takes|honors)\\b[^.]{0,25}Clipper"
    rationale: >
      The direct form of xagency-009, rebuilt against the eighteen-agency corpus
      (issue #162). The ground truth below was derived per agency from
      corpus/processed/chunks.jsonl, not carried over: the version this replaced
      described the six-agency corpus and said SolTrans was the only documented
      participant, which by 2026-08 made the case unpassable by construction —
      an answer that correctly enumerated the corpus was graded as fabricating
      citations, because judge_helpfulness v3 is threaded the rationale and used
      it as truth.

      Seven agencies document Clipper acceptance in their own passages, and each
      has a passage a citation can resolve to. SolTrans (soltrans-clipper-card,
      soltrans-ways-to-pay, soltrans-fare-table). AC Transit ("pay with cash,
      Clipper, or contactless payment", actransit-fares; actransit-discounts).
      County Connection / CCCTA ("accepted on almost all Bay Area transit
      systems, including County Connection", cccta-clipper-card;
      cccta-fare-types-prices makes bus-to-bus transfers Clipper-only). WestCAT
      ("We also accept Clipper", westcat-fares-all; westcat-clipper). Marin
      Transit (marin-clipper; marin-fares gives a 10% Clipper discount off the
      adult cash fare). SamTrans (samtrans-clipper, samtrans-fare-types: passes
      load onto Clipper cards). VTA (vta-fares prices a Clipper single ride in
      its own column and gives two hours of free transfers on it).

      One agency documents the opposite, and it is the sharpest fact in the case:
      scmtd-fares-passes states "Clipper Cards are not honored on METRO buses."
      Santa Cruz METRO is required in the answer for that reason — an
      enumeration that omits the corpus's one explicit refusal is incomplete,
      and one that lists METRO among the participants contradicts a passage it
      can read.

      Nine agencies are silent: e-tran, FAX, HTA, MST, SBMTD, SJRTD, SLO RTA,
      SacRT and Yolobus have no chunk mentioning Clipper at all. Several publish
      their own agency-local fare media (Courtesy Cards, Tap-to-Pay,
      stored-value passes), which is a reason the question comes up and is not
      evidence either way. The teaching point the case has always carried is
      here: silence must not become "does not accept". That half is the judge's
      call — the deterministic side can catch an answer that *invents*
      acceptance for a silent agency (forbidden_content above) but cannot
      reliably catch the inverse, because the negation-window rule in
      phrase_asserted reads a nearby correct denial (METRO's) as excusing an
      incorrect one.

      Vine is the deliberate boundary case and is required neither way.
      vine-fares says eligible riders "can apply for the Clipper START program
      and receive 50% off of your Vine Transit Rides", which documents a
      Clipper-administered discount applying to Vine fares without stating that
      Clipper is accepted as payment on board. Naming Vine and not naming it are
      both defensible; asserting either without saying which passage it rests on
      is not.

      Expected `partial` rather than `answer`: the corpus answers this for nine
      of eighteen agencies and cannot answer it for the other nine, so a
      complete-sounding list is the failure mode, not the goal.

  - id: xagency-011
    question: "I'm 66. Do I pay the same senior fare on FAX and on Humboldt Transit?"
    language: en
    expected_behavior: answer
    rationale: >
      FAX's reduced fare covers seniors 65 or older and is currently $0.00 while
      the subsidy holds (fax-fares); HTA's reduced fare starts at 62 and is a
      discount, not a suspension (hta-fares). Two agencies, two ages, and two
      different kinds of answer — one a price, one the absence of a price with a
      condition attached. A correct answer keeps them separate and cites each.

  - id: xagency-012
    question: "I'm riding a SolTrans bus and transferring to County Connection with my Clipper card. Do I pay full fare again when I board?"
    language: en
    expected_behavior: answer
    required_facts: ["Clipper", "re:[Ff]ree transfer"]
    rationale: >
      The first cross-agency question both sides of which are now in the
      corpus. County Connection's own page (cccta-transfers) says free
      transfers from SolTrans are available only when using Clipper, at
      designated shared stops; SolTrans' page (soltrans-clipper-card) lists
      County Connection among the agencies Clipper supports transfers with and
      says inter-agency bus transfers are good for 60 minutes. Each side must
      be cited to its own agency's page. The windows do not match in scope —
      SolTrans publishes 60 minutes for agency-to-agency transfers, County
      Connection publishes a 2-hour window only for its own bus-to-bus
      transfer — so a correct answer must not present either number as the
      other agency's rule.
  - id: xagency-016
    question: "How much does the RTD Commuter bus from Stockton to Sacramento cost, and what is the basic single ride fare on SacRT once I'm there?"
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?7\\.00", "re:\\$\\s?2\\.50"]
    rationale: >
      The boundary crossing San Joaquin RTD was added for: its Route 163 runs
      into Sacramento, where the rider steps onto SacRT's system, and each half
      of the trip has its own published price. sjrtd-fares Commuter table:
      Stockton to Sacramento $7.00 one-way. sacrt-fares: basic single ride
      $2.50. A correct answer attributes each fare to its agency with its own
      citation and does not price the SacRT leg from RTD's table or vice versa
      — and must not confuse "RTD" (San Joaquin's own brand) with SacRT, whose
      legacy name is also "RT".
  - id: xagency-actransit-001
    question: "What age counts as a senior on AC Transit, and is it the same on SolTrans?"
    language: en
    expected_behavior: answer
    required_facts: ["65", "re:80\\+?"]
    rationale: >
      The xagency-004 trap inverted: here the two ages really are the same,
      and the complete answer still has to keep the agencies apart.
      actransit-discounts puts Senior/Disabled eligibility at 65 and older
      (50% off per actransit-fares); soltrans-fare-table also sets 65+ — and
      then adds a tier AC Transit does not have, "Seniors 80+ ride FREE on
      SolTrans and FAST local routes and SolanoExpress lines." A correct
      answer gives 65 for each agency with its own citation and surfaces the
      SolTrans-only 80+ free tier instead of flattening the two programs
      into "the same discount." Retrieval for this exact wording was checked
      to surface both answer-bearing chunks (actransit-discounts and
      soltrans-fare-table). An earlier draft asked about Clipper acceptance
      on AC Transit versus Santa Cruz METRO; it was dropped because METRO's
      "Clipper Cards are not honored" sentence sits in a transfer-policy
      chunk that Clipper-phrased questions do not retrieve, and a case whose
      required fact retrieval cannot deliver would be scored against the
      model instead of the corpus.
  # Ids jump to xagency-013 because a sibling branch holds xagency-012.
  - id: xagency-013
    question: "I got a paper transfer on a County Connection bus. Will WestCAT take it at a shared stop in Martinez?"
    language: en
    expected_behavior: answer
    required_facts: ["Martinez", "Clipper"]
    rationale: >
      Two agencies' current pages describe the same arrangement incompatibly,
      and the corpus holds both. westcat-transfers: "All Transfers from County
      Connection and Tri Delta Transit at shared stops in Martinez are free
      with a valid transfer." County Connection's own pages (sibling branch;
      cccta-transfers and cccta-fare-types-prices) say its bus-to-bus
      transfers are "only available when using Clipper" — i.e. the paper
      transfer WestCAT promises to honor is a product County Connection's site
      no longer describes issuing. The honest answer states WestCAT's
      published rule with its citation, states that the issuing agency's
      published transfer channel is Clipper, and recommends confirming with
      the agencies rather than resolving the conflict itself. Until the
      County Connection branch merges, retrieval holds only WestCAT's side;
      the case still requires the answer to name the Clipper condition, which
      westcat-transfers itself carries for inter-agency transfers.

  - id: xagency-014
    question: "With Clipper, how long is my transfer good for between a SolTrans bus and a WestCAT bus?"
    language: en
    expected_behavior: answer
    required_facts: ["60", "120"]
    rationale: >
      The corpus holds two published numbers for the same kind of transfer,
      and neither agency speaks for the other. soltrans-clipper-card:
      inter-agency bus transfers, WestCAT named in the list, "good for 60
      minutes". westcat-transfers: Clipper transfers "are good for 120
      minutes after boarding a bus". A grounded answer attributes each window
      to the agency that published it, cites both pages, does not average or
      pick one, and recommends confirming with the agencies for the trip in
      question. Blending the two into a single confident number is the
      failure this case exists to catch.
  # SLO RTA: xagency-017, not xagency-012, which is held by the sibling San
  # Joaquin RTD branch (see the ground-059 note in groundedness.yaml).
  - id: xagency-017
    question: "Is the senior fare age the same on SLO RTA and Santa Barbara MTD?"
    language: en
    expected_behavior: answer
    required_facts: ["65", "80"]
    rationale: >
      Central Coast neighbors a rider can plausibly use in one day, and the
      shared number is the trap: both systems start their senior fare at 65
      (slorta-fares Senior 65-79; sbmtd-fares-passes Seniors age 65+ $1.25),
      but RTA's tier ends at 79 because seniors 80 and over ride RTA free with
      a VIP Card, while SBMTD publishes no such upper tier. "Same age" is half
      true, and the half that differs is worth real money to an 80-year-old.
      A correct answer gives each agency's own structure with its own
      citation and does not export the VIP tier to SBMTD.
  - id: xagency-vta-001
    question: "I'm 81. Do seniors my age ride free on VTA or on SolTrans?"
    language: en
    expected_behavior: answer
    required_facts: ["re:80\\+?|80 or older", "65"]
    rationale: >
      A free tier that exists at exactly one of the two agencies.
      soltrans-fare-table: "Seniors 80+ ride FREE on SolTrans and FAST local
      routes and SolanoExpress lines." VTA publishes no free-senior tier:
      its senior category starts at 65 with documented alternatives
      (vta-fares), and its senior PRICE sits in the category-blind table the
      manifest's representational-gap note describes, so the honest VTA half
      states the 65+ criterion and the free Senior Clipper card path without
      asserting a dollar amount. A correct answer keeps the two programs
      apart with a citation each, gives SolTrans' 80+ free rule, and does
      not extend it to VTA. Retrieval for this exact wording was checked to
      surface both answer-bearing chunks. Deterministic checks and no
      determination: the answer describes the tiers, it does not tell the
      rider "you ride free."
  # Id jumps to xagency-015 because sibling branches hold xagency-012..014.
  - id: xagency-015
    question: "SolTrans says Clipper covers transfers with the Vine's Route 11. Does the Vine's own fare policy confirm that?"
    language: en
    expected_behavior: answer
    required_facts: ["Route 11", "SolTrans"]
    rationale: >
      The asymmetry case: soltrans-clipper-card lists "NAPA VINE Route 11"
      among the agencies Clipper supports transfers with, good for 60
      minutes — SolTrans' characterization. The Vine's own ingested pages
      (vine-fares, vine-go) document the Clipper START discount and the
      Vine's own paper-transfer rules, and say nothing about Clipper
      inter-agency transfer credits with anyone. The honest answer attributes
      the transfer claim to SolTrans' page, states that the Vine's own
      published fare policy in this corpus does not document it, and points
      the rider to the Vine to confirm — it must not convert one agency's
      characterization into the other agency's policy, and must not convert
      the corpus's silence into a denial either.
  - id: xagency-samtrans-001
    question: "Does the Clipper START discount work on both SamTrans and SolTrans?"
    language: en
    expected_behavior: answer
    required_facts: ["re:50"]
    rationale: >
      A regional program, answered per agency: samtrans-fare-types ("The
      Clipper START program offers a 50% fare discount for adult low-income
      SamTrans riders") and SolTrans' pages (the Clipper START 50% discount
      on SolTrans). Each half must carry its own agency's citation; the
      regional card invites exactly the generalization the
      soltrans-clipper-scope cases forbid, so the answer states each
      agency's published participation and stops there — it does not
      enumerate other agencies the passages never mention.
  - id: xagency-marin-001
    question: "Do I get free transfers with Clipper on both Marin Transit and SolTrans?"
    language: en
    expected_behavior: answer
    required_facts: ["re:no transfers|are no transfers", "re:2 hours|two hours"]
    rationale: >
      A sharp published contrast between two Clipper agencies:
      marin-clipper gives "Unlimited free rides within 2 hours of first
      boarding a Marin Transit bus", while soltrans-clipper-card states
      "there are no transfers within the SolTrans system." A correct
      answer gives each agency its own rule with its own citation and does
      not let the regional card imply a regional rule — the
      soltrans-clipper-scope discipline.
