# Cross-agency suite: questions that name two corpus agencies and expect an
# answer addressing each, with a citation to each. Retrieval already surfaces
# both agencies' passages (tested in tests/test_retrieve.py); these cases test
# whether the *answer* keeps them separate and cited rather than blurring them.
#
# Status: live-validated targets. The deterministic checks (citation present,
# as-of, language, no determination) run offline, but whether each answer cites
# both agencies and states each fare correctly is an LLM-judge call that needs a
# live `make eval`. No prompt change ships with these: the existing system prompt
# may already handle multi-agency questions, and a live run decides whether a
# rule is needed. These cases are not in the CI smoke subset (no `smoke: true`),
# and the regression baseline must be refreshed (`--update-baseline`) on the
# first live run that includes this suite.
suite: cross_agency
cases:
  - id: xagency-001
    question: "Do youth ride free on both Yolobus and SacRT?"
    language: en
    expected_behavior: answer
    rationale: >
      Yolobus youth 0-18 ride free (yolobus-fares); SacRT offers fare-free transit
      for TK-12 students through RydeFreeRT (sacrt-fares). A good answer states
      both, cites both, and does not conflate the two programs.

  - id: xagency-002
    question: "Is the senior discount age the same on MST and Yolobus?"
    language: en
    expected_behavior: answer
    rationale: >
      MST's discount is 65 and older (mst-fares); Yolobus's senior fare is 62 and
      older (yolobus-fares). The answer must give each age with its agency and
      cite each, not assume one age covers both.

  - id: xagency-003
    question: "What single-ride fares do Yolobus and SacRT charge?"
    language: en
    expected_behavior: answer
    rationale: >
      Yolobus and SacRT publish their own single-ride fares (yolobus-fares,
      sacrt-fares). A correct answer attributes each fare to its agency with a
      citation, rather than reporting one figure for both.

  # Elk Grove (E-tran) x SacRT. The single most likely boundary crossing in the
  # corpus: e-tran annexed into SacRT in 2021, the E-prefix routes kept their own
  # fare table, and a rider going from Elk Grove into Sacramento meets both. Every
  # fact each case needs is in a retrieved passage from one of the two agencies.
  - id: xagency-004
    question: "I am 62 and ride the Elk Grove buses. Is the senior fare the same when I ride SacRT?"
    language: en
    expected_behavior: answer
    rationale: >
      Both systems set the senior threshold at 62, and the two prices differ:
      etran-fares puts the Military/Senior/Medicare/Disabled single fare at $1.10,
      while sacrt-fares puts the senior single at $1.25. The trap is the shared age
      cutoff, which invites an answer that treats "same age" as "same fare." A
      correct answer gives each price with its own agency and citation.

  - id: xagency-005
    question: "Can I use my Elk Grove daily pass on SacRT light rail?"
    language: en
    expected_behavior: answer
    rationale: >
      etran-fares "Elk Grove Passes": the Elk Grove daily pass is valid for
      unlimited rides on routes with an "E" prefix and the rider should "obtain a
      transfer, if transferring to other SacRT services"; the same passage notes
      that E routes accept SacRT tickets and passes, with a transfer fee on a light
      rail single ride ticket. sacrt-fares gives the SacRT side: a $0.25 transfer
      ticket. The acceptance runs one way, and an answer that reports it as
      reciprocal sends the rider onto light rail holding a pass that does not cover
      it.

  - id: xagency-006
    question: "Does the Elk Grove Senior Pass cover SacRT light rail too?"
    language: en
    expected_behavior: answer
    rationale: >
      etran-senior-pass defines the program's scope as "SacRT fixed-route bus
      routes that begin or end within the City of Elk Grove," and lists exactly
      which ones: E10-E19 and E110-E116. Light rail is not among them. The answer
      must hold to the published scope and point the rider at SacRT's own light
      rail fares (sacrt-fares) rather than extending a city-funded bus program to a
      mode the page never mentions.

  - id: xagency-007
    question: "Is the fare cap the same on MST and Santa Cruz METRO?"
    language: en
    expected_behavior: answer
    required_facts: ["re:\\$\\s?6", "re:31[ -]day"]
    rationale: >
      The sharpest conflation risk in the corpus, because the two agencies are
      neighbors, both run contactless fare payment, and both are Cal-ITP Benefits
      agencies — so the surface story is identical and the rules are not. MST
      publishes three concrete caps: $6 per day, $20 per week, $70 per month
      (mst-fares). Santa Cruz METRO publishes a daily cap and a rolling 31-day cap
      that starts at the first tap, and publishes NO weekly cap at all
      (scmtd-tap2cruz); its cap amounts live in a fare-table image that is not in
      the corpus. A correct answer keeps the two apart, cites each, and says
      METRO's amounts are not in the published text it has. The failure this case
      exists to catch is quoting MST's $6/$20/$70 — or, worse, MST's weekly cap —
      as if it were METRO's, which would send a Santa Cruz rider looking for a
      weekly cap that does not exist.

  - id: xagency-008
    question: "Do 17-year-olds get the discount fare on MST and on Santa Cruz METRO?"
    language: en
    expected_behavior: answer
    required_facts: ["re:18 years and under|18 and under", "re:free"]
    rationale: >
      Same discount word, two different structures. MST lists "18 years and under"
      as a discount-fare category outright (mst-fares). Santa Cruz METRO does not:
      its Discount Fare is "adults age 65 and over, people with disabilities", and
      a 17-year-old is served instead by the Youth Cruz Free Program, which is free
      rather than discounted and covers local Santa Cruz County routes only
      (scmtd-fares-passes). The answer must give each agency its own rule with its
      own citation. Carrying MST's youth discount across the county line is the
      error; so is reporting METRO's youth program as a "discount fare", which
      would understate it.
