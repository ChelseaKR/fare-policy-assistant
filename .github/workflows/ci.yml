name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"  # nightly full suite

# Least privilege by default; jobs that need AWS add id-token themselves.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Lint
        run: uv run ruff check src tests evals web
      - name: Typecheck
        run: uv run mypy src web
      - name: Tests
        run: uv run pytest -q
      - name: Accessibility (structural gate)
        run: uv run python -m web.a11y

  a11y-advisory:
    # Advisory axe/pa11y pass over the served page — the cross-check the
    # pure-Python structural gate cannot do (computed contrast, ARIA semantics).
    # Non-blocking: the structural gate in `checks` is the merge gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run pa11y on the static page (WCAG2AA)
        run: npx --yes pa11y@8 --standard WCAG2AA --runner axe ./web/index.html

  smoke-evals:
    # 25-case smoke suite on every PR. AWS access comes from GitHub OIDC
    # federation (no long-lived keys): set the AWS_OIDC_ROLE_ARN repository
    # variable to an IAM role that trusts this repo's OIDC subject and allows
    # bedrock:InvokeModel on the pinned models. Forks and repos without the
    # variable run offline: deterministic checks only, judges recorded as
    # skipped.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Configure AWS credentials via OIDC
        if: ${{ vars.AWS_OIDC_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Run smoke suite
        run: uv run python -m evals.runner --smoke
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run
          path: evals/runs/

  full-evals-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Configure AWS credentials via OIDC
        if: ${{ vars.AWS_OIDC_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Full eval run
        run: uv run python -m evals.runner --full
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            EVALS.md
            docs/eval-report.html
            evals/runs/

  independent-audit:
    # Advisory (not a merge gate): replay the committed GovChat-Eval dataset
    # through the external harness and publish the report. Runs on PRs and
    # nightly; needs no AWS — the dataset is recorded answers, scored offline by
    # the deterministic judge. See docs/audits/methodology.md.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Clone GovChat-Eval
        run: git clone --depth 1 https://github.com/ChelseaKR/govchat-eval.git ../govchat-eval
      - name: Validate dataset
        run: cd ../govchat-eval && uv run govchat-eval validate --dataset "$GITHUB_WORKSPACE/evals/govchat/golden.jsonl"
      - name: Run audit
        run: |
          cd ../govchat-eval && uv run govchat-eval run \
            --config "$GITHUB_WORKSPACE/evals/govchat/govchat-eval.toml" \
            --dataset "$GITHUB_WORKSPACE/evals/govchat/golden.jsonl" \
            --baseline "$GITHUB_WORKSPACE/evals/govchat/baseline.json" \
            --out "$GITHUB_WORKSPACE/docs/audits"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-audit
          path: docs/audits/
