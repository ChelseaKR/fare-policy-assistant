name: security

# SAST (Semgrep) + secret scanning (gitleaks) + dependency-vulnerability
# scanning (pip-audit) — backlog #4 of the SECURITY-AND-SUPPLY-CHAIN-STANDARD.
# All three gates are blocking: a finding fails the build. These run
# alongside, and are independent of, the assistant's no-determination /
# citation / PII gates enforced in ci.yml.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Every job here only reads the checkout.
permissions:
  contents: read

concurrency:
  # Key pull requests on the ref and pushes on the commit.
  #
  # A concurrency group holds one running run and one pending run. A third run
  # joining the group cancels the pending one before it dispatches a single job,
  # so that commit ends `cancelled` with zero jobs and no verdict at all. Keyed
  # only on `github.ref`, every push to the default branch shared one group with
  # the merge before it, so a burst of merges lost the middle ones.
  #
  # Measured 2026-09-05 over the 100 most recent runs on `main`: 16 ended
  # `cancelled`, 6 of them with zero jobs dispatched. This workflow produces four
  # required status checks: the dependency scan, the secret scan, Semgrep, and
  # zizmor.
  #
  # Keying pushes on the SHA gives every merge its own group, so pushes never
  # contend. Pull requests keep the shared `-pr` key, so pushing again to a PR
  # still cancels the previous, now-irrelevant run; `cancel-in-progress` is left
  # exactly as it was, and is now unreachable for pushes.
  group: security-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Puts all 279 commits on disk. Necessary, and on its own NOT
          # sufficient: `fetch-depth` decides what is fetched, never what the
          # scanner is asked to read. That is decided by the invocation below.
          fetch-depth: 0
          persist-credentials: false  # read-only job; no credential should outlive checkout (zizmor artipacked)
      - name: Secret scan (gitleaks, full history)
        # This step used to be `gitleaks/gitleaks-action`, which picks its scan
        # range from the triggering event: on a push it runs
        # `gitleaks detect --log-opts=--no-merges --first-parent BASE^..HEAD`,
        # and when the push carries a single commit -- which every squash merge
        # into `main` is -- it runs `--log-opts=-1`, i.e. exactly one commit.
        # On a pull request it reads only that PR's own commits. This workflow
        # has no `schedule` and no `workflow_dispatch`, so no run of it had ever
        # read more than 1 of `main`'s 279 commits. A credential added in one
        # commit and deleted in the next was invisible to a required check
        # named `Secret scan (gitleaks)`, and the `fetch-depth: 0` above did not
        # change that.
        #
        # A pinned, checksum-verified binary invoked as `gitleaks git .` with no
        # `--log-opts` walks every commit reachable from HEAD on every event, so
        # the range no longer depends on how the run was triggered. `.gitleaksignore`
        # at the repository root is auto-discovered, so the 12 fingerprint-pinned
        # allowlist entries still apply and the rules stay at full strength.
        run: |
          set -euo pipefail
          GL=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL}"
          ARCHIVE="gitleaks_${GL}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GL}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false  # read-only job; no credential should outlive checkout (zizmor artipacked)
      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true
      - name: Semgrep scan (blocking on ERROR severity)
        # Pinned tool version; default + python registry rulesets. --error makes
        # any ERROR-severity finding fail the build (no `|| true`).
        run: >
          uvx --from semgrep==1.168.0 semgrep scan
          --config p/default
          --config p/python
          --severity ERROR
          --error
          --metrics off

  dep-scan:
    name: Dependency scan (pip-audit)
    # SEC-11/SEC-13: the committed uv.lock (358 KB of pinned transitive deps,
    # installed from broad lower-bound ranges like anthropic>=0.100) was never
    # scanned for known vulnerabilities anywhere. Renovate proposes updates on
    # a schedule but nothing previously blocked a merge that introduced or kept
    # a known-vulnerable dependency; this closes that gap.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false  # read-only job; no credential should outlive checkout (zizmor artipacked)
      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true
      - name: Lockfile drift check
        # Fails if uv.lock is stale relative to pyproject.toml (CQ-09) before
        # auditing a lockfile that might not even describe what CI installs.
        run: uv sync --locked --all-groups
      - name: Export locked dependencies (excluding the root project itself)
        # pip-audit resolves every audited name against PyPI; the root project
        # itself (fare-policy-assistant) is not published there and would be
        # misreported as an audit failure ("distribution marked as editable" /
        # "not found on PyPI") rather than skipped. Exporting to a plain
        # requirements file (uv's own lock format isn't one pip-audit reads
        # natively) sidesteps that false positive without excluding any real
        # third-party dependency, including the dev/mutation groups.
        run: >
          uv export --frozen --no-emit-project --all-groups
          --format requirements-txt -o /tmp/requirements-audit.txt
      - name: pip-audit over the locked, resolved dependency set (blocking, no mute)
        run: uv run --with pip-audit pip-audit --strict --desc -r /tmp/requirements-audit.txt

  zizmor:
    name: Workflow security (zizmor)
    # CICD-19/20/21: static analysis of the workflow files themselves (this
    # repo's 5 workflows), not the application code. Verified 2026-07-05 to
    # find real, fixable findings (11x "artipacked": actions/checkout steps
    # not setting persist-credentials: false) — the audit's assumption that
    # this would start clean was wrong; those were fixed in the same pass that
    # added this job, so it starts clean going forward, not by coincidence.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false  # read-only job; no credential should outlive checkout (zizmor artipacked)
      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true
      - name: zizmor (blocking; no mute)
        # Pinned tool version, like the Semgrep job above. No --fix here (fixes
        # are for a human/author to apply and review, not to auto-commit in CI).
        run: uvx --from zizmor==1.16.3 zizmor --format plain --no-progress .github/workflows/
