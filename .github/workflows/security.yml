name: security

# SAST (Semgrep) + secret scanning (gitleaks) — backlog #4 of the
# SECURITY-AND-SUPPLY-CHAIN-STANDARD. Both gates are blocking: a finding fails
# the build. These run alongside, and are independent of, the assistant's
# no-determination / citation / PII gates enforced in ci.yml.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the secret-scan job widens to read PR metadata.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # gitleaks scans the whole history, not just the tip
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report via the job summary only; commenting would need write scope.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
      - name: Semgrep scan (blocking on ERROR severity)
        # Pinned tool version; default + python registry rulesets. --error makes
        # any ERROR-severity finding fail the build (no `|| true`).
        run: >
          uvx --from semgrep==1.168.0 semgrep scan
          --config p/default
          --config p/python
          --severity ERROR
          --error
          --metrics off
