# Two publication paths to the same site, gated on two different triggers.
#
# `workflow_dispatch` (below, unchanged): a canonical, sanitized, cryptographically
# pinned promotion-evidence manifest. Stays manual because the caller must bind one
# trusted source commit to one separately reviewed evidence-only commit and its
# exact manifest digest. It can only ever publish a run whose gates passed
# (verify_promotion_evidence refuses anything else) and, as of this file's last
# review, has never had evidence to publish — see docs/publishing-the-evidence-hub.md.
#
# `schedule` (added 2026-09-04, issue #140): republishes several times a day
# from whatever the CI workflow's most recently completed nightly run is, pass
# or fail, so the hub tracks a real measurement instead of freezing at the last
# manual dispatch. Deliberately NOT `workflow_run` on CI's completion: zizmor
# (`zizmor (blocking; no mute)`, this repo's one unsuppressible finding class)
# flags `workflow_run` as categorically insecure, and this repo treats that
# rule as categorical rather than arguing a suppression past it. Polling on our
# own schedule instead of reacting to CI's event also buys something a
# workflow_run consumer cannot structurally have: it still runs, and still
# republishes, on a night the nightly never fires at all — see the
# "nightly-build" job below and
# docs/decisions/0032-the-nightly-hub-publishes-every-run-pass-or-fail.md for
# why publishing a failing (or missing) run is the correct behavior here, not
# a regression of it.
#
# One-time setup: Settings → Pages → Source = "GitHub Actions".
name: Pages

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full trusted source commit SHA containing the renderer
        required: true
        type: string
      evidence_ref:
        description: Full evidence-only commit SHA containing public-evidence.json
        required: true
        type: string
      expected_public_manifest_sha256:
        description: Lowercase SHA-256 of the exact canonical public-evidence.json
        required: true
        type: string
  schedule:
    # Four checks a day, not one: CI's own nightly cron (17 9 UTC) can run
    # long with 385 live cases, so a single check soon after would race it.
    # Spacing these six hours apart means a late-finishing nightly is picked
    # up within one cycle, and — as important — a nightly that never starts
    # at all still gets a publish attempt four times that day instead of
    # zero, each one able to notice and say so.
    - cron: "17 3,9,15,21 * * *"

permissions:
  contents: read

# One deployment target, so both paths serialize against each other rather than
# racing: whichever finishes last is what the site serves next, and that is the
# intended behavior (a manual promoted-evidence dispatch published after last
# night's nightly should win; the following night's nightly then supersedes it,
# same as it would supersede an older promoted page).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # --- workflow_dispatch: the manual, cryptographically pinned promotion path ---
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      EVIDENCE_REF: ${{ inputs.evidence_ref }}
      EXPECTED_PUBLIC_MANIFEST_SHA256: ${{ inputs.expected_public_manifest_sha256 }}
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PUBLIC_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out trusted source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out evidence-only commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.evidence_ref }}
          path: evidence-checkout
          fetch-depth: 1
          persist-credentials: false

      - name: Verify commits and isolate the one-file evidence input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          git -C source merge-base --is-ancestor \
            "$SOURCE_REVISION" refs/remotes/origin/main
          test "$(git -C evidence-checkout rev-parse HEAD)" = "$EVIDENCE_REF"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C evidence-checkout status --porcelain=v1 --untracked-files=all)"

          mapfile -t evidence_entries < <(
            find evidence-checkout -mindepth 1 -maxdepth 1 ! -name .git -printf '%f\n' | sort
          )
          test "${#evidence_entries[@]}" -eq 1
          test "${evidence_entries[0]}" = "public-evidence.json"
          test -f evidence-checkout/public-evidence.json
          test ! -L evidence-checkout/public-evidence.json

          mkdir evidence
          install -m 0644 evidence-checkout/public-evidence.json evidence/public-evidence.json
          mapfile -t staged_entries < <(
            find evidence -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          )
          test "${#staged_entries[@]}" -eq 1
          test "${staged_entries[0]}" = "public-evidence.json"
          actual_sha256="$(sha256sum evidence/public-evidence.json | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$EXPECTED_PUBLIC_MANIFEST_SHA256"

      - name: Install the trusted renderer environment
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: false

      - name: Synchronize locked dependencies
        working-directory: source
        run: uv sync --frozen --no-dev

      - name: Verify fresh evidence and live runtime before rendering
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://fare.chelseakr.com/version \
            --output live-version-before.json
          cd source
          uv run --no-sync python scripts/build_evidence_site.py compare-runtime \
            --manifest ../evidence/public-evidence.json \
            --version-json ../live-version-before.json \
            --expected-source-revision "$SOURCE_REVISION"

      - name: Render the sanitized site
        shell: bash
        run: |
          set -euo pipefail
          cd source
          render_args=(
            render
            --manifest ../evidence/public-evidence.json
            --template docs/pages/index.html
            --output-dir ../_site
            --expected-source-revision "$SOURCE_REVISION"
          )
          if [[ -f docs/eval-history.svg ]]; then
            render_args+=(--history-svg docs/eval-history.svg)
          fi
          if [[ -f docs/pages/CNAME ]]; then
            render_args+=(--cname docs/pages/CNAME)
          fi
          if [[ -f docs/pages/og-card.png ]]; then
            render_args+=(--og-card docs/pages/og-card.png)
          fi
          uv run --no-sync python scripts/build_evidence_site.py "${render_args[@]}"
          test ! -e ../_site/results.jsonl
          test ! -e ../_site/summary.json
          test ! -e ../_site/promotion.json

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Upload sanitized Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      EVIDENCE_REF: ${{ inputs.evidence_ref }}
      EXPECTED_PUBLIC_MANIFEST_SHA256: ${{ inputs.expected_public_manifest_sha256 }}
    steps:
      - name: Deploy sanitized Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

      - name: Check out trusted source for post-deploy verification
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out evidence-only commit for post-deploy verification
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.evidence_ref }}
          path: evidence-checkout
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          git -C source merge-base --is-ancestor \
            "$SOURCE_REVISION" refs/remotes/origin/main
          test "$(git -C evidence-checkout rev-parse HEAD)" = "$EVIDENCE_REF"
          mapfile -t evidence_entries < <(
            find evidence-checkout -mindepth 1 -maxdepth 1 ! -name .git -printf '%f\n' | sort
          )
          test "${#evidence_entries[@]}" -eq 1
          test "${evidence_entries[0]}" = "public-evidence.json"
          test -f evidence-checkout/public-evidence.json
          test ! -L evidence-checkout/public-evidence.json
          actual_sha256="$(
            sha256sum evidence-checkout/public-evidence.json | cut -d ' ' -f 1
          )"
          test "$actual_sha256" = "$EXPECTED_PUBLIC_MANIFEST_SHA256"

      - name: Install the trusted verifier environment
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: false

      - name: Synchronize locked dependencies
        working-directory: source
        run: uv sync --frozen --no-dev

      - name: Reverify fresh evidence and live runtime after deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://fare.chelseakr.com/version \
            --output live-version-after.json
          cd source
          uv run --no-sync python scripts/build_evidence_site.py compare-runtime \
            --manifest ../evidence-checkout/public-evidence.json \
            --version-json ../live-version-after.json \
            --expected-source-revision "$SOURCE_REVISION"

      - name: Verify the published evidence bytes
        shell: bash
        run: |
          set -euo pipefail
          observed_sha256=""
          for attempt in $(seq 1 20); do
            : "$attempt"
            if curl --fail --silent --show-error \
              --proto '=https' --tlsv1.2 \
              https://evals.chelseakr.com/public-evidence.json \
              --output published-public-evidence.json; then
              observed_sha256="$(
                sha256sum published-public-evidence.json | cut -d ' ' -f 1
              )"
              if [[ "$observed_sha256" == "$EXPECTED_PUBLIC_MANIFEST_SHA256" ]]; then
                exit 0
              fi
            fi
            sleep 3
          done
          echo "published evidence did not converge to the expected digest" >&2
          echo "expected: $EXPECTED_PUBLIC_MANIFEST_SHA256" >&2
          echo "observed: ${observed_sha256:-unavailable}" >&2
          exit 1

  # --- nightly: publish the most recent nightly run, pass, fail, or missing ---
  # Automatic, from our own `schedule` (above), not from `workflow_run` on CI's
  # completion. zizmor's `dangerous-triggers` rule flags `workflow_run` as
  # categorically insecure regardless of how the consumer guards it, this
  # repo's zizmor gate is unsuppressible by design (`zizmor (blocking; no
  # mute)`), so the earlier `workflow_run` design in this file was replaced
  # rather than argued past. Polling on a timer instead of reacting to an
  # event also closes a gap that design had: a `workflow_run` consumer only
  # ever runs when CI produces a completed run to react to, so a night the
  # nightly never fires at all -- schedule disabled, billing block (this has
  # happened before), CI itself broken -- is a night this job would never have
  # run either, silently. Polling runs regardless, four times a day, and finds
  # whatever the most recent completed nightly actually is, however old.
  #
  # Queries the CI workflow's own run history through the read-only Actions
  # API (`gh api`, same-repo, same `GITHUB_TOKEN` already scoped `actions:
  # read` for the artifact download two steps down) rather than trusting any
  # externally supplied identifier, so there is nothing here for an
  # attacker-controlled value to reach.
  #
  # Downloads the "eval-report" artifact ci.yml's full-evals-nightly job
  # already uploads (EVALS.md, docs/eval-report.html, evals/runs/) from
  # whichever run the query names, and republishes only the two files that
  # are already public by established convention: EVALS.md's machine-readable
  # `<!-- provenance {...} -->` block (the same format evals/provenance.py and
  # evals/report.py read and write) and a byte-for-byte copy of
  # docs/eval-report.html. Nothing under evals/runs/ is read or copied.
  #
  # No write credential is used anywhere in this path -- there is no
  # evidence-only commit to bind, only files a past run already produced.
  #
  # Off by default. `vars.NIGHTLY_HUB_PUBLISH_ENABLED` is unset until an
  # operator sets it to the literal string "true" in Settings -> Secrets and
  # variables -> Actions -> Variables. Landing this workflow publishes a
  # currently-failing scoreboard to a public site the moment it first runs;
  # that first publish is deliberately not a consequence of merging this PR or
  # of any scheduled tick firing on its own. It is a decision an operator
  # makes once, explicitly, after reading docs/decisions/0032. Every run before
  # that stays a no-op: nightly-build and nightly-deploy both skip.
  nightly-build:
    if: >-
      github.event_name == 'schedule' &&
      vars.NIGHTLY_HUB_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Find the most recently completed nightly CI run
        id: nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_json="$(
            gh api "repos/$REPO/actions/workflows/ci.yml/runs" \
              -f event=schedule -f status=completed -f per_page=1 \
              --jq '.workflow_runs[0] // empty'
          )"
          if [[ -z "$run_json" ]]; then
            echo "no completed, schedule-triggered CI run exists at all -- refusing to publish" >&2
            exit 1
          fi
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          if [[ "$conclusion" != "success" && "$conclusion" != "failure" ]]; then
            echo "most recent completed nightly CI run concluded '$conclusion' -- not success or failure, skipping this cycle" >&2
            exit 1
          fi
          {
            echo "run_id=$(jq -r '.id' <<<"$run_json")"
            echo "conclusion=$conclusion"
            echo "html_url=$(jq -r '.html_url' <<<"$run_json")"
          } >>"$GITHUB_OUTPUT"

      - name: Download that run's eval-report artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: eval-report
          path: nightly-report
          run-id: ${{ steps.nightly.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Render the nightly snapshot from that run's real numbers
        env:
          RUN_CONCLUSION: ${{ steps.nightly.outputs.conclusion }}
          RUN_URL: ${{ steps.nightly.outputs.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import base64, hashlib, html, json, os, re, sys
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          # One full missed night plus slack for a slow live run, not a round number
          # chosen for looks: the nightly cron fires daily, so any gap wider than this
          # means the nightly has gone quiet, not just run late.
          FRESHNESS_BUDGET_SECONDS = 129600  # 36h

          artifact_dir = Path("nightly-report")
          evals_md_path = artifact_dir / "EVALS.md"
          report_html_path = artifact_dir / "docs" / "eval-report.html"
          if not evals_md_path.is_file():
              sys.exit("nightly artifact has no EVALS.md; refusing to publish an empty snapshot")
          if not report_html_path.is_file():
              sys.exit("nightly artifact has no docs/eval-report.html; refusing to publish an empty snapshot")

          evals_md = evals_md_path.read_text(encoding="utf-8")
          match = re.search(r"<!--\s*provenance\s*(\{.*?\})\s*-->", evals_md, re.S)
          if match is None:
              sys.exit("EVALS.md carries no <!-- provenance {...} --> block; cannot state this run's provenance")
          provenance = json.loads(match.group(1))
          run_at_raw = provenance["run_id"]
          corpus_version = provenance["corpus_version"]
          suites = provenance["suites"]

          mode_match = re.search(r"Generated from the run at `[^`]+` \(([^)]*)\)\.", evals_md)
          run_mode = mode_match.group(1) if mode_match else "mode unrecorded"

          total_passed = sum(int(s["passed"]) for s in suites.values())
          total_cases = sum(int(s["total"]) for s in suites.values())
          pass_rate = round(100 * total_passed / total_cases, 1) if total_cases else 0.0

          rows = "".join(
              f'<tr><th scope="row">{html.escape(name)}</th>'
              f'<td>{suites[name]["passed"]}/{suites[name]["total"]}</td>'
              f'<td>{suites[name]["pass_rate"]:.1f}%</td></tr>'
              for name in sorted(suites)
          )

          run_at_iso = run_at_raw[:-1] + "+00:00" if run_at_raw.endswith("Z") else run_at_raw
          run_at = datetime.fromisoformat(run_at_iso)
          if run_at.tzinfo is None:
              run_at = run_at.replace(tzinfo=UTC)
          expires_at = (run_at + timedelta(seconds=FRESHNESS_BUDGET_SECONDS)).astimezone(UTC).replace(microsecond=0)

          conclusion = os.environ["RUN_CONCLUSION"]
          passed_gate = conclusion == "success"
          gate_class = "ok" if passed_gate else "warn"
          gate_label = "Nightly gate: passed" if passed_gate else "Nightly gate: FAILED"
          gate_detail = (
              "Every gate the nightly run enforces passed against this scoreboard."
              if passed_gate
              else "At least one gate the nightly run enforces failed against this scoreboard "
              "(see the suite table and the linked case-level report for which cases). "
              "This page still publishes the real numbers rather than hiding them."
          )

          FRESHNESS_SCRIPT = """\
          (function () {
            "use strict";
            var box = document.getElementById("evidence-status");
            var label = document.getElementById("evidence-status-label");
            var detail = document.getElementById("evidence-status-detail");
            var live = document.getElementById("evidence-freshness");
            if (!box || !label || !detail || !live) { return; }
            var expiresText = box.getAttribute("data-expires-at");
            var runAt = Date.parse(box.getAttribute("data-run-at"));
            var expiresAt = Date.parse(expiresText);
            if (!isFinite(runAt) || !isFinite(expiresAt)) { return; }
            var now = Date.now();
            if (now < runAt) {
              live.textContent =
                "Your device clock reads earlier than the run this page reports, so the age " +
                "of this snapshot cannot be worked out here. Both instants are printed above.";
              return;
            }
            var days = Math.floor((now - runAt) / 86400000);
            var age = (days === 1 ? "1 day" : days + " days") + " old";
            if (now <= expiresAt) {
              live.textContent =
                "Checked against your device clock as this page loaded: " + age + ", inside the " +
                "one-missed-night budget, which expires " + expiresText + ".";
              return;
            }
            box.className = "notice stale";
            label.textContent = "STALE \\u2014 nightly publishing appears to have stopped";
            detail.textContent =
              "The nightly workflow has not published a newer snapshot in " + age +
              ", longer than one missed night explains. Treat every number below as evidence " +
              "about " + expiresText.slice(0, 10) + " and earlier, not about today, and check " +
              "the CI run history for why the nightly stopped.";
            live.textContent =
              "Checked against your device clock as this page loaded: " + age + ", past the " +
              "one-missed-night budget, which expired " + expiresText + ".";
          })();
          """

          script_hash = "sha256-" + base64.b64encode(
              hashlib.sha256(FRESHNESS_SCRIPT.encode("utf-8")).digest()
          ).decode("ascii")

          template = Path("source/docs/pages/nightly-index.html").read_text(encoding="utf-8")
          placeholder = re.compile(r"\{\{([A-Z][A-Z0-9_]*)\}\}")

          replacements = {
              "SCRIPT_SRC_HASH": script_hash,
              "RUN_DATE": run_at_raw[:10],
              "TOTAL_SCORE": f"{total_passed}/{total_cases} ({pass_rate:.1f}%)",
              "GATE_WORD": "passed" if passed_gate else "FAILED",
              "GATE_CLASS": gate_class,
              "GATE_LABEL": gate_label,
              "GATE_DETAIL": gate_detail,
              "RUN_AT": html.escape(run_at_raw),
              "RUN_MODE": html.escape(run_mode),
              "CORPUS_VERSION": html.escape(corpus_version),
              "RUN_URL": html.escape(os.environ["RUN_URL"]),
              "PUBLISHED_AT": html.escape(
                  datetime.now(UTC).replace(microsecond=0).strftime("%Y-%m-%dT%H:%M:%SZ")
              ),
              "EXPIRES_AT": html.escape(expires_at.strftime("%Y-%m-%dT%H:%M:%SZ")),
              "SUITE_ROWS": rows,
              "FRESHNESS_SCRIPT": FRESHNESS_SCRIPT,
          }

          found = set(placeholder.findall(template))
          if found != set(replacements):
              sys.exit(
                  f"template placeholders {sorted(found)} do not match the "
                  f"renderer's {sorted(replacements)}"
              )

          rendered = placeholder.sub(lambda m: replacements[m.group(1)], template)

          site_dir = Path("_site")
          site_dir.mkdir(parents=True, exist_ok=True)
          (site_dir / "index.html").write_text(rendered, encoding="utf-8")
          (site_dir / "report.html").write_bytes(report_html_path.read_bytes())

          for name in ("CNAME", "og-card.png"):
              src = Path("source/docs/pages") / name
              if src.is_file():
                  (site_dir / name).write_bytes(src.read_bytes())

          history = Path("source/docs/eval-history.svg")
          if history.is_file():
              (site_dir / "eval-history.svg").write_bytes(history.read_bytes())

          (site_dir / "robots.txt").write_text(
              "User-agent: *\nAllow: /\n\nSitemap: https://evals.chelseakr.com/sitemap.xml\n",
              encoding="utf-8",
          )
          (site_dir / "sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
              "<url><loc>https://evals.chelseakr.com/</loc></url>"
              "<url><loc>https://evals.chelseakr.com/report.html</loc></url>"
              "</urlset>\n",
              encoding="utf-8",
          )

          print(
              f"nightly snapshot published: {total_passed}/{total_cases} ({pass_rate}%), "
              f"gate={conclusion}, run_at={run_at_raw}, corpus={corpus_version}"
          )
          PYEOF

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Upload nightly Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  # Same off-by-default gate as nightly-build, repeated rather than inherited:
  # a `needs:` job that skips because its dependency skipped would still be
  # reachable if this `if:` were ever loosened on its own, and this is the job
  # with `id-token: write` and `pages: write`.
  nightly-deploy:
    if: >-
      github.event_name == 'schedule' &&
      vars.NIGHTLY_HUB_PUBLISH_ENABLED == 'true'
    needs: nightly-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy nightly Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
