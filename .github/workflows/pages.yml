# Publishes the evaluation report + improvement-curve to GitHub Pages.
#
# One-time setup (manual, like branch protection): in the repository Settings →
# Pages, set Source = "GitHub Actions". Then run this workflow from the Actions
# tab. It is workflow_dispatch only on purpose, so it never runs (or fails)
# automatically on a push before Pages is enabled.
name: Pages

on:
  workflow_dispatch:

# Least privilege at the top; the deploy job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/pages/index.html _site/index.html
          cp docs/eval-report.html _site/report.html
          cp docs/eval-history.svg _site/trend.svg
          cp docs/pages/CNAME _site/CNAME
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
