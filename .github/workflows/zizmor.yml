name: Workflow SAST (zizmor)

# Static analysis of the workflows themselves: template injection, excessive
# permissions, unpinned actions, dangerous triggers. security.yml's comments
# already cite zizmor findings by name ("zizmor artipacked") without the tool
# ever running here, so this makes the check real rather than aspirational.
#
# Blocking at high severity, which is what these workflows are clean under.
# Run `zizmor --persona=pedantic .github/workflows/` locally for the
# code-smell-level findings that deliberately do not block.
#
# There is no action.yml in this repository, so unlike the sibling repos this
# scans the workflow directory only.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: 'pip'
          python-version: "3.12"
      - run: python -m pip install zizmor
      - run: zizmor --min-severity high .github/workflows/
