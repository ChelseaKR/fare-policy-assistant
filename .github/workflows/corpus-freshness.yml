name: Corpus freshness

# Fare policy goes stale. Once a week (and on demand) re-snapshot the manifest
# URLs, re-process, and — if anything changed — open a PR with the corpus diff.
# The PR's normal CI runs the smoke evals, so a corpus change arrives as a
# reviewable change with its eval impact attached, not as a silent drift or a
# human polling task. This never commits to main directly.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: {}

# Least privilege at the workflow level; the one job that needs to write
# (open the refresh PR) grants itself the scope below (CICD-04).
permissions:
  contents: read

# This workflow writes (pushes the corpus-refresh branch, opens a PR): never
# cancel a run mid-write, and never let a manual dispatch race the Monday
# schedule onto the same branch (CI-CD-STANDARD §8b).
concurrency:
  group: corpus-freshness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # The push/PR-open step below authenticates with its own explicit
          # token (not the checkout-persisted credential), so the checkout
          # itself does not need to leave a credential behind (zizmor
          # artipacked).
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      # Record the corpus_version and the current processed chunks BEFORE
      # re-processing overwrites them, so the report step can diff against a real
      # prior snapshot instead of git plumbing.
        with:
          enable-cache: true
      - name: Snapshot the current corpus version
        run: uv run python tools/corpus_refresh_report.py --snapshot-old /tmp/old.json

      - name: Re-snapshot and re-process the corpus
        # `fetch` now keeps whatever answered and fails only when NOTHING did.
        # It used to exit non-zero if any single source failed, which aborted
        # this step and discarded every document that had fetched successfully:
        # from 2026-07-13 to 2026-08-10 that turned an MST 403 and one stale URL
        # into a total refresh outage, and Yolobus sat two months past a
        # published fare change.
        run: |
          uv run python -m assistant.ingest fetch
          uv run python -m assistant.ingest process

      # Unreachable sources must be visible to a human, not buried in a log of a
      # job that passed. A source that stays unreachable is a corpus going stale
      # in slow motion, which is the failure this whole workflow exists to catch.
      - name: Surface any unreachable sources
        id: unreachable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=corpus/raw/fetch-failures.json
          if [ ! -f "$report" ]; then
            echo "every manifest URL answered"
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Unreachable sources"
            echo
            echo "These manifest URLs did not answer. The refresh kept everything else."
            echo
            echo '```'
            python -c '
          import json
          for f in json.load(open("corpus/raw/fetch-failures.json"))["failed"]:
              print(f["doc_id"] + ": " + f["error"])
          '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python -c '
          import json
          for f in json.load(open("corpus/raw/fetch-failures.json"))["failed"]:
              print("::warning title=corpus source unreachable::" + f["doc_id"] + ": " + f["error"])
          '

      # Key the change decision on corpus_version, not a raw `git diff -- corpus/`:
      # furniture-only churn that leaves the policy text intact opens nothing. On a
      # real change this appends a CHANGELOG entry, lints the eval suites for stale
      # facts, and writes the PR body to /tmp/pr-body.md.
      - name: Detect corpus changes
        id: diff
        run: |
          uv run python tools/corpus_refresh_report.py --report /tmp/old.json --out /tmp/pr-body.md
          if [ -f /tmp/pr-body.md ]; then
            cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # The step above says which documents changed. This says what the
      # assistant would now tell a rider differently, which is the thing a
      # fare-policy owner reviewing this PR actually has to judge. Offline
      # (mock answer model, deterministic checks, no judge), so it costs
      # nothing and cannot reach a provider.
      #
      # /tmp/old.json is the pre-refresh chunk set the snapshot step already
      # wrote; the refreshed corpus is the working tree. The report is appended
      # to the PR body so it arrives attached to the diff it explains.
      #
      # This step never fails. The gate is the separate step *after* the PR is
      # opened: a report nobody reads is worthless, so the evidence ships first
      # and the run goes red second. Swallowing the verdict entirely would be
      # worse than not measuring — a job that concludes `success` over a
      # breached ceiling has removed a signal rather than added one.
      #
      # The ceiling is `--max-unexpected 0`, the default, and it was measured
      # rather than guessed: on the committed 35ec70d6359d → 74b05330cb39 pair
      # (one Yolobus page, the shape of an ordinary weekly refresh) both changed
      # answers cite that page and zero are unexplained. A pair that also added
      # and removed documents reported 7, and all 7 were real re-rankings. If a
      # weekly refresh turns out to sit above zero for honest reasons, raise
      # this one number with the measurement, rather than dropping the step.
      - name: Report answer drift
        id: drift
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -uo pipefail
          uv run python -m evals.drift \
            --from-snapshot /tmp/old.json --to live \
            --max-unexpected 0 \
            --out /tmp/drift.md --json /tmp/drift.json > /tmp/drift.log 2>&1
          code=$?
          cat /tmp/drift.log
          if [ -f /tmp/drift.md ]; then
            printf '\n' >> /tmp/pr-body.md
            cat /tmp/drift.md >> /tmp/pr-body.md
            cat /tmp/drift.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "gate=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -ne 0 ]; then
            echo "::warning title=answer drift::an answer moved with no cited document moving; the refresh PR carries the report"
          fi
          exit 0

      - name: Open a refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: corpus-refresh
          commit-message: "Corpus refresh: re-snapshot manifest URLs"
          title: "Corpus refresh: published fare pages changed"
          body-path: /tmp/pr-body.md
          labels: corpus, automated
          # Each line is handed to `git add --` as one argument, with no shell
          # in between. Quote characters written here therefore become part of
          # the pathspec: from 2026-07-13 to 2026-09-07 the exclude below was
          # written as `':!corpus/raw/fetch-failures.json'` and git answered
          # `fatal: pathspec '':!corpus/raw/fetch-failures.json'' did not match
          # any files`, so nothing was staged, the commit failed, and the action
          # aborted with an empty "Unexpected error". Every run of this workflow
          # in that window failed for that one reason and no refresh PR has ever
          # opened. tests/test_workflow_safety.py now runs these pathspecs
          # against a real `git add` rather than reading them as strings.
          # The exclude is belt-and-braces: .gitignore already lists the file.
          add-paths: |
            corpus/
            :!corpus/raw/fetch-failures.json

      # Deliberately last. The reviewer gets the drift report attached to the PR
      # either way; this is what stops the run from concluding `success` over a
      # ceiling it breached. Ordering is asserted in tests/test_workflow_safety.py,
      # because moving this above the PR step would silently trade the evidence
      # for the verdict.
      - name: Fail on answers that moved with no source behind them
        if: steps.drift.outputs.gate != '' && steps.drift.outputs.gate != '0'
        shell: bash
        run: |
          echo "answer drift exceeded its ceiling. The refresh PR carries the" >&2
          echo "report: cases listed under 'Changed with no cited document" >&2
          echo "moving' are the instrument drifting, not the policy." >&2
          exit 1
