name: Corpus freshness

# Fare policy goes stale. Once a week (and on demand) re-snapshot the manifest
# URLs, re-process, and — if anything changed — open a PR with the corpus diff.
# The PR's normal CI runs the smoke evals, so a corpus change arrives as a
# reviewable change with its eval impact attached, not as a silent drift or a
# human polling task. This never commits to main directly.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: {}

# Least privilege at the workflow level; the one job that needs to write
# (open the refresh PR) grants itself the scope below (CICD-04).
permissions:
  contents: read

# This workflow writes (pushes the corpus-refresh branch, opens a PR): never
# cancel a run mid-write, and never let a manual dispatch race the Monday
# schedule onto the same branch (CI-CD-STANDARD §8b).
concurrency:
  group: corpus-freshness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # The push/PR-open step below authenticates with its own explicit
          # token (not the checkout-persisted credential), so the checkout
          # itself does not need to leave a credential behind (zizmor
          # artipacked).
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      # Record the corpus_version and the current processed chunks BEFORE
      # re-processing overwrites them, so the report step can diff against a real
      # prior snapshot instead of git plumbing.
      - name: Snapshot the current corpus version
        run: uv run python tools/corpus_refresh_report.py --snapshot-old /tmp/old.json

      - name: Re-snapshot and re-process the corpus
        run: |
          uv run python -m assistant.ingest fetch
          uv run python -m assistant.ingest process

      # Key the change decision on corpus_version, not a raw `git diff -- corpus/`:
      # furniture-only churn that leaves the policy text intact opens nothing. On a
      # real change this appends a CHANGELOG entry, lints the eval suites for stale
      # facts, and writes the PR body to /tmp/pr-body.md.
      - name: Detect corpus changes
        id: diff
        run: |
          uv run python tools/corpus_refresh_report.py --report /tmp/old.json --out /tmp/pr-body.md
          if [ -f /tmp/pr-body.md ]; then
            cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open a refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: corpus-refresh
          commit-message: "Corpus refresh: re-snapshot manifest URLs"
          title: "Corpus refresh: published fare pages changed"
          body-path: /tmp/pr-body.md
          labels: corpus, automated
          add-paths: |
            corpus/
