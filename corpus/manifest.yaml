  # (ADR 0008), and alt text is not extracted — so no chunk contains those
  # figures and no answer can cite them. The prose on /tap2cruz/ does carry the
  # rule (daily and 31-day caps exist; the 31-day cap is rolling from the first
  # tap; the same payment method must be used throughout), which is what the
  # assistant can ground on. Note the direction of the error this prevents: the
  # adult day cap ($5.00) is LOWER than the cash Day Pass ($6.00), so an
  # assistant that saw only the Fares page would quote a day price higher than
  # what a tapping rider actually pays. Re-check on any refetch: if METRO ever
  # publishes the cap amounts as HTML, they belong in the corpus.

  # ── SolTrans (Solano County Transit) ──────────────────────────────────────
  # Added as the eighth agency (2026-08-12; written as the sixth, renumbered on
  # merge because Elk Grove and Santa Cruz METRO landed first). Vallejo/Benicia,
  # plus SolanoExpress lines reaching Fairfield, Vacaville, Dixon, Davis, and the
  # SF Ferry Building.
  #
  # WHY THIS AGENCY: it is the first Clipper participant in the corpus. Every
  # other agency's fare media is agency-local, so until now the corpus could not
  # answer "does my Clipper card work here" for anyone.
  #
  # THE CLIPPER HAZARD, AND IT CUTS BOTH WAYS. Clipper is a *regional* card, so a
  # rider will reasonably read a Clipper answer as generalizing. It does not, and
  # the corpus cannot support that reading:
  #   (a) None of MST, SBMTD, Yolobus, SacRT, HTA, E-tran, or SCMTD is a Clipper
  #       agency. For all but one of them the corpus is simply silent on Clipper,
  #       so an answer that infers "Clipper is regional, so it works on SacRT too"
  #       is ungrounded. The exception was added by the Santa Cruz METRO merge and
  #       cuts the right way: scmtd-fares-passes states outright that "Clipper
  #       Cards are not honored on METRO buses", which is published evidence
  #       AGAINST the regional inference rather than for it. So the corpus now
  #       holds one agency that takes Clipper, one that says in writing it does
  #       not, and six that say nothing — and an assistant must not generalize
  #       from any of the three groups to the others. Cased as
  #       soltrans-clipper-scope in cross_agency.
  #   (b) SolTrans' own Clipper page makes assertions about THIRD PARTIES that are
  #       not SolTrans policy and that SolTrans does not control. Specifically:
  #       "You may use Clipper on many public transit services throughout the San
  #       Francisco Bay Area, including BART"; the list of connecting agencies
  #       Clipper supports transfers with (Golden Gate Transit 40/42, NAPA VINE
  #       Route 11, San Francisco Bay Ferry, WestCat, County Connection); and "the
  #       Ferry Monthly Pass is not currently available on Clipper". Those are
  #       SolTrans' characterizations of other operators' and MTC's arrangements,
  #       dated to whenever the page was last edited. What is genuinely SolTrans
  #       policy on the same pages: the Clipper START 50% discount *on SolTrans*,
  #       the Vallejo-SF Bay Ferry transfer credits ($1.75 adult / $1.50 youth /
  #       $0.85 senior-disabled-Medicare), "there are no transfers within the
  #       SolTrans system", and "Clipper charges the Outside County fare on all
  #       SolTrans SolanoExpress lines".
  #
  # FARE PERIOD (verified 2026-08-12): the fare table is stamped "Effective
  # Sunday, December 5, 2021" with NO end date, so it is an open-ended effective-
  # from, not an expired committed range like Yolobus's. It is live and current by
  # the agency's own labeling, and its Day Pass prices ($4.50 / $5.50 / $10.00
  # adult) are independently corroborated by the site-wide navigation fare summary
  # rendered on every page. But see the staleness note on soltrans-fare-table:
  # the page predates two later changes SolTrans itself announced.
  #
  # EXCLUDED, deliberately:
  #   https://www.soltrans.org/fares/ticket-office-location — despite the title it
  #   contains no ticket-office content; it is a stale duplicate of the Clipper
  #   Card page that states the Clipper START discount as "20 percent" where the
  #   live /fares/clipper-card page, the June 2024 paperless press release, and
  #   SolTrans' own "Get 50% Adult Fares with Clipper START" news item all say 50
  #   percent. Ingesting it would put two different discount rates for one program
  #   into retrieval with nothing to break the tie. Same reasoning as the
  #   sbmtd.gov/reduced/ exclusion in docs/decisions/0002.
  #   https://www.soltrans.org/fares — a hub page; its body is only links to the
  #   four sub-pages, no policy text of its own.
  #   https://www.soltrans.org/help-center — its Fares/Clipper/Token Transit FAQ is
  #   relevant, but the same page carries parking-permit, Lyft-subsidy, and
  #   trip-planning content that would pollute fare retrieval, and several answers
  #   are collapsed accordions whose bodies do not render into the static HTML.
  - id: soltrans-fare-table
    agency: SolTrans
    agency_full: Solano County Transit
    title: "Fare Table"
    url: https://www.soltrans.org/fares/fare-table
    language: en
    # STALENESS WARNING — this page is live and is SolTrans' canonical fare table,
    # but it is stamped "Effective Sunday, December 5, 2021" and predates two
    # changes SolTrans announced afterwards, so parts of it are wrong on the day it
    # was fetched:
    #   1. RETIRED PRODUCT. It tells riders "Please use cash or a paper pass for
    #      travel within Solano County or locally on SolanoExpress lines" and
    #      carries a block of paper-pass handling rules ("do not laminate or punch
    #      holes in passes"). SolTrans eliminated paper passes on all Local Routes
    #      and Express Lines effective 2024-07-01; paper passes survive only on
