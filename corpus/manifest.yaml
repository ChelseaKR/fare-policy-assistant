  - id: scmtd-tap2cruz
    agency: SCMTD
    agency_full: Santa Cruz Metropolitan Transit District
    title: "Tap2Cruz (contactless payment and fare capping)"
    url: https://scmetro.org/tap2cruz/
    language: en
    license_note: "Public agency fare information; scmetro.org serves no Content-Signal."
  # Two further METRO pages were fetched and then excluded, so the choice is on
  # the record rather than looking like an oversight:
  #   /rider-info/fares-passes/transfer-policy/ — the METRO/MST interoperability
