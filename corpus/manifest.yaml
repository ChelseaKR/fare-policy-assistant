  # Covers the Ride Humboldt fixed-route systems (Redwood Transit, Eureka
  # Transit, Arcata & Mad River, North State Express). Distinctive policy: the
  # reduced fare applies only to stored-value passes, not day/week/month passes.
  - id: hta-fares
