  # ── Fresno Area Express (City of Fresno) ──────────────────────────────────
  # Added as the sixth agency (2026-08-12). First Central Valley agency in the
  # corpus; every other one is coastal or Sacramento-region.
  #
  # FARE PERIOD (checked 2026-08-12). FAX publishes no effective-date range, so
  # there is no expiry to compare today against. What the pages do carry:
  #   * The $1.00 base fare is the fare the current page shows, and the page's
  #     own site metadata reports it last modified 2026-03-25.
  #   * The reduced fare is $0.00 — not a discount, a suspension. Both the page
  #     ("For a Limited Time, Reduced Fares are Free") and the program PDF
  #     ("Reduced Fare riders can ride free at this time while subsidy funding
  #     is available", Rev. 03/2026) condition it on funding rather than on a
  #     date. An answer that quotes the free reduced fare without that condition
  #     is quoting a price that has no published end and no published guarantee.
  #     The condition is in the ingested text, so the assistant can cite it.
  # There is no fare capping and no account-based fare product here: no page on
  # www.fresno.gov mentions a cap, and a site-wide search for "fare capping"
  # returns nothing (checked 2026-08-12). FAX is flat-fare cash/pass with free
  # 90-minute unlimited transfers, so a single-ride price is a complete answer
  # for fixed route — which is why the transfer rule is ingested with it.
  - id: fax-fares
    agency: FAX
    agency_full: Fresno Area Express (City of Fresno)
    title: "Fares & Passes"
    url: https://www.fresno.gov/transportation/fares-passes/
    language: en
    license_note: "Public agency fare information; no Content-Signal served. Site terms: https://www.fresno.gov/internet-policy/"
  # The corpus's first PDF documents (ADR 0008 shipped the capability and left
  # the first real one as a follow-up; this is it). Both are born-digital with a
  # text layer, so no OCR extra is needed. The Spanish one is a real translation,
  # not an untranslated shell — compare the mst-fares-benefits note above.
  - id: fax-reduced-fare-program
    agency: FAX
    agency_full: Fresno Area Express (City of Fresno)
    title: "Reduced Fare Program Instructions"
    url: https://www.fresno.gov/wp-content/uploads/2026/03/Reduced-Fare-Program-Instructions-English-03-2026-Free-10w1429.pdf
    language: en
    format: pdf
    license_note: "Public agency fare information; no Content-Signal served. Site terms: https://www.fresno.gov/internet-policy/"
  - id: fax-reduced-fare-program-es
    agency: FAX
    agency_full: Fresno Area Express (City of Fresno)
    title: "Programa de Tarifas Reducidas (Spanish reduced-fare instructions)"
    url: https://www.fresno.gov/wp-content/uploads/2026/03/Programa-de-Tarifas-Reducidas-Espanol-03-2026-Gratis-10w1429.pdf
    language: es
    format: pdf
    license_note: "Public agency fare information; no Content-Signal served. Site terms: https://www.fresno.gov/internet-policy/"
  # Excluded FAX pages, and why. All five fetch fine; each would put a wrong
  # fare, a dead product, or non-fare bulk into retrieval — the SBMTD /reduced/
  # mistake (see above), mostly with a price attached.
  #   /transportation/fax/handy-ride/ — fetched and ingested during this work,
  #     then dropped. It chunks to 13 sections of which 8 are the ADA
  #     reasonable-modification policy (request process, denial grounds,
  #     complaint routing), which repeats "Fresno Area Express" often enough to
  #     outrank the fare table: with the page in the corpus, "What does a 31-day
  #     pass cost on Fresno Area Express?" returned two reasonable-modification
  #     sections above fax-fares#3. Every Handy Ride fare it carries ($1.25 per
  #     ride, $1.25 companion, PCA free, $36 31-day pass) is already on the
  #     fares page. Its unique content — who is ADA-eligible for Handy Ride and
  #     the number to call for an application — is a real corpus gap, but it is
  #     eligibility for a *service*, not a fare, and it costs 13 chunks of
  #     verbatim third-party text on the /offline reference to carry.
  #   /transportation/fax/rider-tools/bus-riding-basics/ — carries "NOTICE TO
  #     RIDERS WHO HAVE MEDICARE CARDS – Riders who possess a Medicare Card and
  #     proper identification are eligible for a 50¢ one-way fare at all times."
  #     Medicare cardholders currently ride free, which the same page says a few
  #     paragraphs earlier ("At this time, eligible reduced fare riders can ride
  #     free"). A page that contradicts itself on price is not a source.
  #   /transportation/fax/frequently-asked-questions/ — two stale facts. Its
  #     transfer rule ("transfer to two additional FAX buses ... not valid for
  #     layover or return trips") was superseded on 2022-01-03 by unlimited
  #     90-minute transfers, per FAX's own announcement of the change. It also
  #     still sells a "10-Ride Card"; the current fares page sells 20- and
  #     50-ride prepaid cards and no 10-ride product.
  #   /transportation/attention-fax-reduced-fare-riders/ — the 2022-06-23 news
  #     post announcing that the Kaiser Permanente grant made reduced fares free
  #     from 2022-07-01. Useful history for why the fare is $0.00, but it is a
  #     four-year-old announcement and reads as current if retrieved.
  #   The "Current Fare Structure – English" PDF linked from the fares page
  #     (wp-content/uploads/2026/03/2024_1206_NewStudentFareDecal_Farebox_O.pdf)
  #     is a farebox decal image with no text layer. Extracting it needs the OCR
  #     path, which ADR 0008 deliberately keeps out of CI. Its prices are on the
  #     HTML fares page anyway. Worth knowing that the link the agency labels
  #     "Current Fare Structure" resolves to a file named for December 2024.
  # Oddities inside the text we DID ingest, found while writing the eval cases
  # and left as-is because editing an agency's words would break the point of
  # snapshotting them:
  #   * fax-fares#1 prices the non-subsidized student single fare as ".75 cents"
  #     where the fare table on the same page says $0.75. The table is right.
  #   * fax-fares#4 says pass outlets may add a fee "for passes and tokens";
  #     nothing else on the page sells a token, and the bulk products are
  #     prepaid ride cards.
  #   * fax-fares#5's legend defines key 4 (31 Day Student Fare), but no outlet
  #     row in the table above it carries that key.
  #   * fax-fares#6 contains "[email protected]" — Cloudflare's email-obfuscation
  #     placeholder, which survives because ingest strips the <script> that
  #     would rewrite it in a browser. Pre-existing, not FAX-specific:
  #     mst-veterans-resource#1 has carried the same placeholder all along.
  # ── Elk Grove Transit Services (e-tran) ───────────────────────────────────
  # Added as the sixth agency (2026-08-12). Scoped separately from SacRT on
  # purpose: e-tran annexed into SacRT in July 2021, but the Elk Grove "E"-prefix
  # routes still run their own fare table, and it differs from SacRT's core table
  # on the numbers a rider is most likely to ask about — basic single ride $2.25
  # vs SacRT's $2.50, transfer $0.50 vs SacRT's $0.25, daily $6.00 vs $7.00. Under
  # one shared agency key those two tables would sit in the same retrieval bucket
  # and the assistant could quote either figure for either question. A separate
  # scope keeps the agency filter able to tell them apart.
  #
  # FARE PERIOD, verified 2026-08-12 (the Yolobus lesson: a committed fare period
  # that has already expired is worse than no fare page at all):
  #   etran-fares publishes NO effective range. Its dateline reads "June 30,
  #   2021"; its metadata says published 2021-06-30, modified 2025-06-12; and its
  #   body says the fares "will remain the same at this time," which was written
  #   about July 2021. On its own that is ambiguous, not current. What makes it
  #   current is the sibling page: etran-senior-pass, modified 2026-04-14,
  #   describes a City program that launched 2026-03-30 and reimburses SacRT "at
  #   the discounted single ride rate" for Elk Grove routes — i.e. SacRT was still
  #   operating this fare table, with a discount tier, four months ago. The
  #   $2.25/$1.10 figures also appear in the City's March 2026 council coverage of
  #   that pilot. Treat the 2021 dateline as a stale *page* date over live fares,
  #   not as a lapsed fare period. Re-check at the next corpus refresh; if a
  #   future refresh finds the page still frozen at 2021 with no corroborating
  #   sibling, contain it the way yolobus-fares was contained.
  #   etran-senior-pass DOES publish an explicit range: "available through June
  #   30, 2027, or until the $100,000 program fund is fully expended, whichever
  #   comes first." Today (2026-08-12) is inside that window. The
  #   fund-exhaustion condition is not observable from any published page, so the
  #   assistant must never state the pass is still funded — only what the page
  #   published. Eval case fresh-012 pins that behavior.
  - id: etran-fares
    agency: E-tran
    agency_full: Elk Grove Transit Services (e-tran), operated by Sacramento Regional Transit District
    title: "Elk Grove Transit Fares"
    url: https://www.sacrt.com/elk-grove-transit-fares/
    language: en
    license_note: "Public agency fare information, published by SacRT; no Content-Signal served."
  - id: etran-senior-pass
    agency: E-tran
    agency_full: Elk Grove Transit Services (e-tran), operated by Sacramento Regional Transit District
    title: "Elk Grove Senior Pass"
    url: https://www.sacrt.com/egsenior/
    language: en
    license_note: "Public agency fare information, published by SacRT; no Content-Signal served."
  # No Spanish counterpart: sacrt.com serves Spanish through a Google Translate
  # widget rather than published /es/ pages, so there is no Spanish source
  # document to catalogue for this agency. The multilingual gap is deliberate.

# ── GTFS(-Fares) cross-validation (EXP-06) ──────────────────────────────────
# A second, structured evidence source, checked against the prose documents
# above so a disagreement ("web page says $2.50, feed says $3.00") is caught
# mechanically instead of by luck. The feed is a tripwire, never a source of
# truth: `src/assistant/gtfs.py` only flags disagreement, it never overrides
# an answer or prefers the feed price over the cited prose. See
# docs/decisions/0011-gtfs-cross-validation.md.
#
# Survey (live-fetched 2026-07-08): MST and SBMTD both resolve to a working
# static GTFS feed with fare data. Yolobus, SacRT, and HTA did not resolve to
# a GTFS zip at any conventionally-guessed URL in this pass (no agency GTFS
# aggregator API key was available to look one up authoritatively either).
# Per the "the design must tolerate feed absent" note in the EXP-06 ideation
# entry, they are left out below rather than pointed at a guessed URL that
# might 404 or silently serve the wrong agency's data. `make gtfs-check`
# reports them as `no_feed`, not a failure. Add an entry once a real feed URL
# is confirmed for one of them.
gtfs_feeds:
  - agency: MST
    url: https://www.mst.org/google/google_transit.zip
    fares_version: v1 # fare_attributes.txt + fare_rules.txt
  - agency: SBMTD
    url: https://www.sbmtd.gov/google_transit/feed.zip
    fares_version: v2 # fare_products.txt + fare_leg_rules.txt + rider_categories.txt
