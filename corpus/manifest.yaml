# Corpus manifest — every document the assistant may cite.
# `python -m assistant.ingest fetch` snapshots each URL into corpus/raw/<id>.html
# and stamps fetch_date. Snapshots are committed; the UI and report disclose
# "based on policies published as of <fetch_date>".
#
# Robots/permissions notes (checked 2026-06-11) — these govern FETCHING only:
#   mst.org      robots.txt allows * with Crawl-delay 10; Cloudflare Content-Signal
#                "search=yes, ai-train=no" (ai-input unspecified). We do not train on
#                this content; it is retrieved and quoted with attribution. Fetched
#                once, manually, with an identified user agent.
#   sbmtd.gov    robots.txt allows all (wp-admin excluded).
#   yolobus.com  robots.txt allows all; Crawl-delay 10 honored.
#   sacrt.com    robots.txt allows all (wp internals excluded).
#   unitrans.ucdavis.edu was in the original pilot list but its WAF returns 403 to
#   non-browser clients; per the "polite fetching only" rule it was dropped and
#   SacRT (the planned stretch agency) substituted. See docs/decisions/0002.
#   Re-checked 2026-08-12 before adding a sixth agency, and unchanged. Its
#   robots.txt is permissive (HTTP 200, stock Drupal, nothing disallowed under
#   /passes, /fare-policy, or /other-passes-and-accepted-fares, no Crawl-delay,
#   no Content-Signal header on any response), but every HTML page still
#   returns a Cloudflare 403 to this project's own fetcher, from a residential
#   IP rather than a datacenter one. robots.txt and the WAF disagree and the
#   WAF is what a fetcher meets. Still excluded. Evidence in docs/decisions/0002.
#   www.fresno.gov (FAX) robots.txt checked 2026-08-12: "User-agent: * /
#                Disallow: /wp-admin/ / Allow: /wp-admin/admin-ajax.php /
#                Crawl-delay: 10", plus a Sitemap line. Nothing under
#                /transportation/ or /wp-content/uploads/ is disallowed. The host
#                is behind Cloudflare too, and unlike unitrans.ucdavis.edu it
#                served every page and PDF below with HTTP 200 to this project's
#                identified user agent on the first try; no Content-Signal
#                header and no Content-Signal line in robots.txt. Crawl-delay 10
#                honored.
#
# Elk Grove e-tran, permission findings (checked 2026-08-12). Two candidate hosts
# were checked before the corpus entries below were written, and BOTH were ruled
# out; the pages actually catalogued come from sacrt.com, already cleared above:
#   elkgrove.gov  NO-GO. elkgrovecity.org 301s to elkgrove.gov. robots.txt itself
#                 returns 200 and allows * (excluding /core/, /profiles/, /admin/,
#                 /search*, /user/*), but every HTML path — including the site
#                 root — returns HTTP 403 with a Cloudflare "Attention Required!"
#                 interstitial to this project's identified research user agent.
#                 That is the Unitrans wall (ADR 0002), and the same rule applies:
#                 we do not spoof a browser user agent to get around a WAF, so the
#                 City of Elk Grove's own transit pages are not fetched at all.
#   www.e-tran.org NO-GO, and not for a robots reason: its robots.txt is fully
#                 permissive (`Disallow:` empty, only /cgi-bin/ excluded). The
#                 host is not the agency. It serves a stale third-party scrape of
#                 sacrt.com — `<link rel="canonical" href="https://www.sacrt.com">`,
#                 a footer reading "© 2022 Sacramento Regional Transit District",
#                 and a trailing line reading "This is a free demo result from the
#                 Wayback Machine Downloader. It is not a complete website." Its
#                 sitemap.xml lists a single /trending/ URL and is stamped
#                 "created with Free Online Sitemap Generator". Permission to crawl
#                 a mirror is not authority to quote it as an agency's fare
#                 schedule; excluded.
#   Authoritative publisher: SacRT. e-tran and e-van annexed into SacRT in July
#   2021, so Elk Grove fares are now published by SacRT on sacrt.com (cleared
#   above, robots allows all bar wp internals) and fetched under the same
#   Crawl-delay. Both Elk Grove pages below are HTML, not PDF; no PDF ingest
#   (ADR 0008) was needed for this agency.
#
# Robots/permissions note for Santa Cruz METRO (checked 2026-08-12) — read this
# one before trusting it, because METRO answers on two hosts and they do not say
# the same thing.
#   scmetro.org  is where the pages live and is the host this project fetched.
#                Its robots.txt (nginx, WordPress default) is four lines:
#                "User-agent: *  /  Disallow: /wp-admin/  /  Allow:
#                /wp-admin/admin-ajax.php  /  Sitemap:
#                https://scmetro.org/wp-sitemap.xml". No Content-Signal, no
#                per-agent rules, nothing excluded but the WP admin directory.
#                All three documents below sit outside /wp-admin/ and were
#                fetched with the identified user agent and the 10s crawl delay.
#   www.scmtd.com is METRO's legacy domain. It no longer serves the pages (it
#                301s to scmetro.org) but it is still fronted by Cloudflare, and
#                Cloudflare's managed robots.txt there says something stronger:
#                "User-agent: *  /  Content-Signal: search=yes,ai-train=no,
#                use=reference  /  Allow: /", followed by a managed block list
#                that disallows named AI crawlers outright — Amazonbot,
#                Applebot-Extended, Bytespider, CCBot, ClaudeBot,
#                CloudflareBrowserRenderingCrawler, Google-Extended, GPTBot,
#                meta-externalagent. The file is entirely Cloudflare's managed
#                block; METRO has authored no rules of its own in it.
#   How this project read that, so a reviewer can disagree with the reasoning
#   rather than have to reconstruct it: the fetcher is
#   fare-policy-assistant-research/0.1, it is none of the named crawlers, and it
#   did not present any other agent's name — so it falls under `User-agent: *`,
#   which both hosts allow. `ai-train=no` is honored: this project does not train
#   on fetched content, it retrieves and quotes it with attribution and a link
#   back. `ai-input` is left unspecified on the legacy host, which the signal's
#   own preamble says neither grants nor restricts — the same unresolved position
#   already recorded for mst.org, and this project's use (retrieval) is ai-input.
#   Two things a reviewer may reasonably weigh differently, and neither is hidden
#   here: the legacy host's managed list names ClaudeBot, and a maintainer who
#   treats an agent-initiated fetch as covered by that line should drop this
#   agency the way Unitrans was dropped; and `use=reference` is a signal about
#   how AI systems may consume content, which bears on committing snapshots, not
#   just on fetching them.
#
# Robots/permissions note for the eighth agency, SolTrans (checked 2026-08-12):
#   soltrans.org  Apex redirects 301 to www.soltrans.org (Webflow behind
#                 Cloudflare). https://www.soltrans.org/robots.txt is 45 bytes and
#                 contains exactly one line, `Sitemap: https://www.soltrans.org/
#                 sitemap.xml` — no User-agent group, no Disallow, so nothing is
#                 excluded for any agent. No Cloudflare Content-Signal header was
#                 served on robots.txt or on any of the four fare pages, and no
#                 `x-robots-tag` on the content pages (robots.txt itself carries
#                 `x-robots-tag: noindex`, which governs indexing that file, not
#                 the site). All pages returned HTTP 200 to this project's
#                 identified research user agent on the first try — no WAF
#                 challenge, no `cf-mitigated`, no browser-UA workaround needed or
#                 attempted. Crawl-delay is unspecified; the manifest's 10-second
#                 default was honored anyway.
#
# Robots/permissions note for the tenth agency, VTA (checked 2026-08-13 PT /
# 2026-08-14 UTC):
#   www.vta.org  robots.txt is stock Drupal (HTTP 200, nginx, Last-Modified
#                2026-08-06): `User-agent: *` disallows only CMS internals
#                (/core/, /profiles/, /admin/, /search/, /user/*, README and
#                composer files) — nothing under /go/fares or /fares. No
#                Crawl-delay (the manifest's 10-second default was honored
#                anyway), no per-agent rules, no Content-Signal line in
#                robots.txt, and no Content-Signal or x-robots-tag header on
#                any fetched page. All three pages below returned HTTP 200 to
#                this project's identified user agent on the first try — no
#                WAF challenge, no workaround needed or attempted.
#
# Redistribution terms (checked 2026-08-12) — a separate question, and the one
# that matters for a repository that commits the snapshots. robots.txt says
# whether a crawler may fetch a page; it says nothing about whether anyone may
# republish it. Recorded here as URLs only: read the agency's terms yourself, do
# not read a summary of them written by this project. Where no terms page could
# be found, that is stated plainly; silence is not permission, and this project
# claims no redistribution right over any of it (see corpus/LICENSE-NOTE.md and
# NOTICE). Every page below also carries the agency's own copyright line in its
# footer, preserved in the corpus/raw/ snapshots.
#   MST      terms of use: none located, checked 2026-08-12 (site sitemap and
#            page footers list only https://mst.org/privacy-policy/, which covers
#            visitor data collection). Footer: "©2026 Monterey-Salinas Transit".
#   SBMTD    terms of use: https://sbmtd.gov/disclaimer/#terms_of_use
#            (one page carrying both the privacy policy and the terms of use).
#            Footer: "© 2026 Santa Barbara MTD, All rights Reserved."
#   Yolobus  terms of use: none located, checked 2026-08-12 (page sitemap and
#            footer list only https://yolobus.com/privacy-policy/). Footer:
#            "© Copyright 2026 Yolo Transportation District All Rights Reserved".
#   SacRT    website terms of use: none located, checked 2026-08-12.
#            https://www.sacrt.com/terms-conditions/ exists but is purchase-order
#            terms for vendors, not site or content terms. Footer: "© 2026
#            Sacramento Regional Transit District. All rights reserved."
#   FAX      site terms: https://www.fresno.gov/internet-policy/ ("Internet
#            Policy", linked from every page footer; it carries a section headed
#            "Copy Restrictions" — read it there, not here). Footer: "© 2026 |
#            City of Fresno". Checked 2026-08-12.
#   E-tran   published on sacrt.com, so SacRT's line above governs; no separate
#            terms page, checked 2026-08-12. The City of Elk Grove funds the
#            Senior Pass program described on one of the pages but does not
#            publish either page; elkgrove.gov is unreachable to this fetcher in
#            any case (see the NO-GO note above).
#   SCMTD    terms of use governing content reuse: none located, checked
#            2026-08-12. The site publishes a "Privacy & Use Policy" at
#            https://scmetro.org/organization/privacy-use/ (effective March 15,
#            2023), which covers visitor data collection and its vendors' terms
#            of service; it says nothing about copying or republishing METRO's
#            own page content. Footer: "©2026 SC Metro, All Rights Reserved."
#   HTA      terms of use: none located, checked 2026-08-12 (the site returns its
#            home page with HTTP 200 for unknown paths, so a 200 on a guessed
#            /terms/ URL is not evidence a terms page exists; the footer links no
#            legal pages). Footer: "© 2026 HTA. All rights reserved".
#   SolTrans terms of use: none located, checked 2026-08-12. The published
#            sitemap enumerates the whole site and lists exactly one legal page,
#            https://www.soltrans.org/about/policies/privacy-policy; there is no
#            terms-of-use entry. Footer: "© 2024 SolTrans" (a bare copyright line,
#            and note the footer year is 2024, not the current year).
#   VTA      terms of use: none located, checked 2026-08-13 (page footers link
#            only /privacy-policy; no copyright line is rendered in the served
#            HTML).
# The per-document `license_note` fields below describe what the material is and
# the Content-Signal seen when it was fetched. None of them is a grant of rights
# by this project, which has none to give.

user_agent: "fare-policy-assistant-research/0.1 (portfolio reference project; ckellyreif@gmail.com)"
crawl_delay_seconds: 10

