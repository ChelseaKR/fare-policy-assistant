# Corpus manifest — every document the assistant may cite.
# `python -m assistant.ingest fetch` snapshots each URL into corpus/raw/<id>.html
# and stamps fetch_date. Snapshots are committed; the UI and report disclose
# "based on policies published as of <fetch_date>".
#
# Robots/permissions notes (checked 2026-06-11):
#   mst.org      robots.txt allows * with Crawl-delay 10; Cloudflare Content-Signal
#                "search=yes, ai-train=no" (ai-input unspecified). We do not train on
#                this content; it is retrieved and quoted with attribution. Fetched
#                once, manually, with an identified user agent.
#   sbmtd.gov    robots.txt allows all (wp-admin excluded).
#   yolobus.com  robots.txt allows all; Crawl-delay 10 honored.
#   sacrt.com    robots.txt allows all (wp internals excluded).
#   unitrans.ucdavis.edu was in the original pilot list but its WAF returns 403 to
#   non-browser clients; per the "polite fetching only" rule it was dropped and
#   SacRT (the planned stretch agency) substituted. See docs/decisions/0002.

user_agent: "fare-policy-assistant-research/0.1 (portfolio reference project; ckellyreif@gmail.com)"
crawl_delay_seconds: 10

documents:
  # ── Monterey-Salinas Transit ──────────────────────────────────────────────
  - id: mst-fares
    agency: MST
    agency_full: Monterey-Salinas Transit
    title: "Fares"
    url: https://mst.org/fares/
    language: en
    license_note: "Public agency fare information; Content-Signal search=yes, ai-train=no."
  - id: mst-fares-benefits
    agency: MST
    agency_full: Monterey-Salinas Transit
    title: "Benefits (Cal-ITP reduced fares)"
    url: https://mst.org/fares/benefits/
    language: en
    license_note: "Public agency fare information; Content-Signal search=yes, ai-train=no."
  # Note: MST's Courtesy Card page was retired; the program now appears on the
  # main Fares page with PDF applications. PDF ingest is deferred (open question
  # #3 in CLAUDE.md). The old /passes/military/ page 404s; veterans fare info
  # lives at /mobility/veterans-resource/.
  - id: mst-veterans-resource
    agency: MST
    agency_full: Monterey-Salinas Transit
    title: "Veterans Resource"
    url: https://mst.org/mobility/veterans-resource/
    language: en
    license_note: "Public agency fare information; Content-Signal search=yes, ai-train=no."
  - id: mst-fares-es
    agency: MST
    agency_full: Monterey-Salinas Transit
    title: "Tarifas (Spanish fares page)"
    url: https://mst.org/es/fares/
    language: es
    license_note: "Public agency fare information; Content-Signal search=yes, ai-train=no."

  # ── Santa Barbara MTD ─────────────────────────────────────────────────────
  - id: sbmtd-fares-passes
    agency: SBMTD
    agency_full: Santa Barbara Metropolitan Transit District
    title: "Fares & Passes"
    url: https://sbmtd.gov/fares-passes/
    language: en
    license_note: "Public agency fare information."
  # Note: https://sbmtd.gov/reduced/ looked like a reduced-fare page but is a
  # stale 2022 temporary-service-reduction notice; excluded so it cannot pollute
  # retrieval. SBMTD reduced-fare policy lives on the Fares & Passes page.
  - id: sbmtd-farechange
    agency: SBMTD
    agency_full: Santa Barbara Metropolitan Transit District
    title: "Fare Change"
    url: https://sbmtd.gov/farechange/
    language: en
    license_note: "Public agency fare information."

  # ── Yolobus (Yolo County Transportation District) ─────────────────────────
  - id: yolobus-fares
    agency: Yolobus
    agency_full: Yolo County Transportation District
    title: "Fares"
    url: https://yolobus.com/fares/
    language: en
    license_note: "Public agency fare information."
  - id: yolobus-reduced-fare-id
    agency: Yolobus
    agency_full: Yolo County Transportation District
    title: "Reduced Fare ID"
    url: https://yolobus.com/reducedfareid/
    language: en
    license_note: "Public agency fare information."
  - id: yolobus-purchasing
    agency: Yolobus
    agency_full: Yolo County Transportation District
    title: "Purchasing a Ticket or Pass"
    url: https://yolobus.com/purchasing-a-ticket-or-pass/
    language: en
    license_note: "Public agency fare information."

  # ── Sacramento Regional Transit ───────────────────────────────────────────
  - id: sacrt-fares
    agency: SacRT
    agency_full: Sacramento Regional Transit District
    title: "Fares"
    url: https://www.sacrt.com/fares/
    language: en
    license_note: "Public agency fare information."

  # ── Humboldt Transit Authority ────────────────────────────────────────────
  # Added as the fifth agency (2026-06-16). robots.txt allows all but /wp-admin/.
  # Covers the Ride Humboldt fixed-route systems (Redwood Transit, Eureka
  # Transit, Arcata & Mad River, North State Express). Distinctive policy: the
  # reduced fare applies only to stored-value passes, not day/week/month passes.
  - id: hta-fares
    agency: HTA
    agency_full: Humboldt Transit Authority
    title: "Fares"
    url: https://humboldttransit.org/fares/
    language: en
    license_note: "Public agency fare information."

# ── GTFS(-Fares) cross-validation (EXP-06) ──────────────────────────────────
# A second, structured evidence source, checked against the prose documents
# above so a disagreement ("web page says $2.50, feed says $3.00") is caught
# mechanically instead of by luck. The feed is a tripwire, never a source of
# truth: `src/assistant/gtfs.py` only flags disagreement, it never overrides
# an answer or prefers the feed price over the cited prose. See
# docs/decisions/0009-gtfs-cross-validation.md.
#
# Survey (live-fetched 2026-07-08): MST and SBMTD both resolve to a working
# static GTFS feed with fare data. Yolobus, SacRT, and HTA did not resolve to
# a GTFS zip at any conventionally-guessed URL in this pass (no agency GTFS
# aggregator API key was available to look one up authoritatively either).
# Per the "the design must tolerate feed absent" note in the EXP-06 ideation
# entry, they are left out below rather than pointed at a guessed URL that
# might 404 or silently serve the wrong agency's data. `make gtfs-check`
# reports them as `no_feed`, not a failure. Add an entry once a real feed URL
# is confirmed for one of them.
gtfs_feeds:
  - agency: MST
    url: https://www.mst.org/google/google_transit.zip
    fares_version: v1 # fare_attributes.txt + fare_rules.txt
  - agency: SBMTD
    url: https://www.sbmtd.gov/google_transit/feed.zip
    fares_version: v2 # fare_products.txt + fare_leg_rules.txt + rider_categories.txt
