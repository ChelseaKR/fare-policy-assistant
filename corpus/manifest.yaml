  # payment with Tap2Cruz." Effective 2026-07-01, no end date published, so it
  # covers today. Every figure in that image matches the HTML fare table
  # snapshotted in scmtd-fares-passes ($2.00 / $6.00 / $65.00 adult local,
  # $1.00 / $3.00 / $32.00 discount, $7.00 / $14.00 / $145.00 Highway 17), which
