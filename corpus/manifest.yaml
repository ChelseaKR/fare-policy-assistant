  # ── Santa Clara Valley Transportation Authority (VTA) ─────────────────────
  # Added as the tenth agency (2026-08-13 PT). WHY THIS AGENCY: the largest
  # system in the corpus, and an accumulator-capped one — VTA's "Day Pass
  # Accumulator" caps a Clipper-cash rider at the Day Pass price, published
  # as prose the pipeline can quote: "ensures the Clipper® cash rider will
  # never pay more than the price of a Day Pass ... once you've paid the
  # equivalent of a Day Pass, any further local rides that day will be free."
  #
  # THE REPRESENTATIONAL GAP, stated before the documents so nobody trusts
  # the fare table further than it deserves: /go/fares renders its four fare
  # tables (Adult 19-64, Adult Express, Senior 65+ & Disabled, Youth 5-18)
  # inside a tab widget whose category labels are <button role="tab"> and
  # <summary> elements. The ingester reads headings, paragraphs, list items,
  # and table rows (ADR 0005's linearizer), so the four price blocks land as
  # four near-identical sections each headed "Available for purchase using:"
  # — WITH their prices but WITHOUT the rider category that distinguishes
  # them. No ingested sentence binds $2.50/$7.50/$90 to "Adult" or $1/$3/$30
  # to "Senior/Disabled". The bindings exist only in UI furniture the chunk
  # model drops, and the snapshots are the agency's words, not this
  # project's to edit, so THE CATEGORY-TO-PRICE TABLE IS NOT FAITHFULLY
  # REPRESENTABLE in the current pipeline. What IS representable, because
  # VTA states it in prose: the Day Pass Accumulator rule; 2-hour free
  # Clipper transfers with the express carve-out; the $2.50 local-to-Express
  # surcharge and its Youth and Senior/Disabled/Medicare exemption; the
  # discount ages ("Seniors must be age 65 or older and Youth must be age
  # 5-18"); "Children under five ride free"; the calendar-month pass window
  # (sold the 16th of the prior month through the 15th); the full Clipper
  # START criteria (50% off, 19-64, Bay Area resident, no RTC card,
  # household income at or below 200% of the federal poverty level); the
  # annual subscription (12 months for the price of 11); the Paratransit ID
  # free-ride rule with its exclusion list; and, on the transfers page, a
  # worked example that states the adult local fare in a sentence ("tags and
  # pays $2.50 for a VTA local fare"). Eval case refuse-vta-001 pins the
  # honest behavior for a category-price question the corpus cannot bind.
  # Re-check on any refetch: if VTA ever publishes the per-category tables
  # as labeled text, the gap closes and that case should be rewritten.
  #
  # CROSS-AGENCY CAUTION, the SolTrans-Clipper shape: vta-regional-transfers
  # describes arrangements with third parties (BART, Caltrain, AC Transit,
  # Dumbarton Express, SamTrans, ACE, Capitol Corridor, Highway 17 Express).
  # Those are VTA's characterizations of inter-operator agreements, citable
  # as what VTA publishes, never as the other operator's own policy. Its "up
  # to $2.85" transfer-credit figure is MTC's regional arrangement as VTA
  # states it; other agencies' live pages state the same program differently,
  # and an answer must quote the asked-about agency's page.
  #
  # FARE PERIOD: no effective-date banner on any page above; the fares page
  # carries one dated operational note ("Beginning 12/10/25", on TVM
  # behavior), which is in the past and consistent with a current page. No
  # end date published anywhere; treated as live by the agency's own
  # framing, the SolTrans open-ended pattern rather than the Yolobus
  # expired-period one.
  #
  # Fetched and excluded: /go/fares/clipper — card-purchase and TVM
  # mechanics (where to buy, how to tag, balance checks); its fare-policy
  # facts (free Youth/Senior Clipper cards, the accumulator restated) are
  # already on the two pages kept, and the METRO splash-pass-faqs precedent
  # keeps app mechanics out of fare retrieval.
  #
  # No Spanish counterpart: vta.org serves other languages through a Google
  # Translate widget rather than published /es/ pages (checked 2026-08-13),
  # so there is no Spanish source document to catalogue. The multilingual
  # gap is deliberate (the e-tran precedent); ml-vta-001 is an honest
  # cross-lingual case.
  - id: vta-fares
    agency: VTA
    agency_full: Santa Clara Valley Transportation Authority (VTA)
    title: "Fares"
    url: https://www.vta.org/go/fares
    language: en
    # See the representational-gap note above: this page's four fare tables
    # arrive without their rider-category tab labels.
    license_note: "Public agency fare information; no Content-Signal served."
  - id: vta-regional-transfers
    agency: VTA
    agency_full: Santa Clara Valley Transportation Authority (VTA)
    title: "Regional Transfers"
    url: https://www.vta.org/go/fares/regional-transfers
    language: en
    license_note: "Public agency fare information; no Content-Signal served. Contains third-party assertions (BART, Caltrain, AC Transit, Dumbarton Express, SamTrans, ACE, Capitol Corridor, Highway 17 Express) that are VTA's characterization, not those agencies' own published policy."
  - id: vta-rtc-card
