    license_note: "Public agency fare information; no Content-Signal served. Contains third-party assertions (BART, Golden Gate Transit, NAPA VINE, SF Bay Ferry, WestCat, County Connection) that are SolTrans' characterization, not those agencies' own published policy."
  - id: soltrans-ways-to-pay
